<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Huuuh?</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: linear-gradient(160deg, #1a0533 0%, #0b1b3a 45%, #062018 100%);
      color: #fff;
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
    }
    main { text-align: center; padding: 1.5rem; }
    h1 {
      margin: 0 0 1rem;
      font-size: clamp(3.2rem, 13vw, 7.5rem); line-height: 0.9;
      letter-spacing: -0.03em; font-weight: 900;
      color: #fff;
      -webkit-text-stroke: 8px #000;
      paint-order: stroke fill;
    }
    video { width: min(92vw, 720px); height: auto; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 12px; background: #000; display: block; margin: 0 auto; }
    .row { display: flex; gap: 0.6rem; justify-content: center; align-items: center; margin-top: 1rem; flex-wrap: wrap; }
    .clips { display: flex; gap: 0.45rem; }
    .clips button, #play {
      color: #111; background: #fff; border: 3px solid #000; cursor: pointer;
    }
    .clips button {
      width: 3.1rem; height: 3.1rem; border-radius: 10px;
      font: 900 1.35rem Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
    }
    .clips button[aria-pressed="true"], .clips button:hover, #play:hover { background: #ffe566; }
    #play {
      width: 4.2rem; height: 4.2rem; border-radius: 50%;
      display: inline-grid; place-items: center;
    }
    #play svg { width: 1.7rem; height: 1.7rem; margin-left: 0.15rem; }
    .pad-stage {
      width: min(92vw, 520px);
      margin: 1.15rem auto 0;
      display: grid;
      grid-template-columns: minmax(4.8rem, auto) minmax(168px, 260px) minmax(3.8rem, auto);
      grid-template-rows: auto auto auto;
      align-items: center;
      justify-content: center;
      column-gap: 0.5rem;
      row-gap: 0.35rem;
      font-family: system-ui, sans-serif;
      font-weight: 700;
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .edge-n { grid-column: 2; grid-row: 1; }
    .edge-w { grid-column: 1; grid-row: 2; }
    .edge-e { grid-column: 3; grid-row: 2; }
    .edge-s { grid-column: 2; grid-row: 3; }
    #pad {
      grid-column: 2;
      grid-row: 2;
      width: 100%;
      aspect-ratio: 1;
      position: relative;
      border: 3px solid #000;
      border-radius: 16px;
      background: rgba(255,255,255,0.08);
      touch-action: none;
      user-select: none;
      cursor: grab;
    }
    #dot {
      position: absolute;
      width: 26px;
      height: 26px;
      box-sizing: border-box;
      border-radius: 50%;
      background: #ffe566;
      border: 3px solid #000;
      transform: translate(-50%, -50%);
      left: 50%;
      top: 50%;
      pointer-events: none;
    }
    #voice { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    #status {
      min-height: 1.2em;
      margin: 0.45rem 0 0;
      font-family: system-ui, sans-serif;
      font-size: 0.85rem;
      font-weight: 650;
      color: #ffb4b4;
    }
  </style>
</head>
<body>
  <main>
    <h1>HUUUH?</h1>
    <video id="huh" src="/clips/A.mp4" width="1280" height="720" playsinline muted preload="auto"></video>
    <audio id="voice" playsinline webkit-playsinline preload="auto" src="audio/A.wav"></audio>
    <div class="row">
      <div class="clips" role="group" aria-label="Clip">
        <button type="button" data-clip="A" aria-pressed="true">A</button>
        <button type="button" data-clip="B" aria-pressed="false">B</button>
        <button type="button" data-clip="C" aria-pressed="false">C</button>
        <button type="button" data-clip="D" aria-pressed="false">D</button>
      </div>
      <button id="play" type="button" aria-label="Play">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
      </button>
    </div>
    <p id="status"></p>
    <div class="pad-stage">
      <div class="edge-n">Shocked</div>
      <div class="edge-w">Unbothered</div>
      <div id="pad" aria-label="Mood. Left unbothered, right annoyed, down dry, up shocked.">
        <div id="dot"></div>
      </div>
      <div class="edge-e">Annoyed</div>
      <div class="edge-s">Dry</div>
    </div>
  </main>
  <script src="vendor/rubberband/rubberband.js?v=8"></script>
  <script src="js/huh-audio.js?v=16"></script>
  <script>
    (function () {
      var DOT = 26;
      var video = document.getElementById('huh');
      var pad = document.getElementById('pad');
      var dot = document.getElementById('dot');
      var picks = [].slice.call(document.querySelectorAll('.clips button'));
      var clip = 'A';
      var padX = 0;
      var padY = 0;
      var dragging = false;
      var audio = document.getElementById('voice');
      var status = document.getElementById('status');
      var active = false;
      var waitingForSound = false;
      var rafId = 0;
      var playStamp = 0;
      var latestBuffer = null;
      var latestKey = '';
      var renderSerial = Promise.resolve();
      var debounceTimer = 0;
      var blobUrl = '';
      var queuedUrl = '';
      var queuedDuration = 0;
      var soundDuration = 0;
      var baseRate = 1;
      var engineLoaded = false;
      var engineReady = HuhAudio.loadEngine('vendor/rubberband/rubberband.wasm');
      engineReady.then(function () { engineLoaded = true; }, function () {});
      var rawClip = null;
      var bytesReady = HuhAudio.fetchWavBytes('audio/A.wav');
      if (!audio.getAttribute('src')) audio.src = 'audio/A.wav';

      video.muted = true;
      video.controls = false;

      function readCorners() {
        try {
          var raw = JSON.parse(localStorage.getItem('huh-corners') || 'null');
          if (raw && typeof raw === 'object') return raw;
        } catch (e) {}
        return null;
      }

      function clamp(v, lo, hi) {
        return v < lo ? lo : v > hi ? hi : v;
      }

      function placeDot() {
        var innerW = Math.max(1, pad.clientWidth - DOT);
        var innerH = Math.max(1, pad.clientHeight - DOT);
        var inset = DOT / 2;
        dot.style.left = (inset + ((padX + 1) / 2) * innerW) + 'px';
        dot.style.top = (inset + ((1 - padY) / 2) * innerH) + 'px';
      }

      function pointFromEvent(e) {
        var rect = pad.getBoundingClientRect();
        var style = window.getComputedStyle(pad);
        var borderL = parseFloat(style.borderLeftWidth) || 0;
        var borderT = parseFloat(style.borderTopWidth) || 0;
        var innerW = Math.max(1, pad.clientWidth - DOT);
        var innerH = Math.max(1, pad.clientHeight - DOT);
        var inset = DOT / 2;
        var localX = clamp(e.clientX - rect.left - borderL, inset, inset + innerW);
        var localY = clamp(e.clientY - rect.top - borderT, inset, inset + innerH);
        padX = clamp(((localX - inset) / innerW) * 2 - 1, -1, 1);
        padY = clamp(1 - ((localY - inset) / innerH) * 2, -1, 1);
        placeDot();
      }

      // Renders the sound for the current dot synchronously. Returns true when
      // a new sound was made. With swapNow the audio src changes even if the
      // old sound is still playing (Play is about to restart anyway).
      function renderNow(swapNow) {
        if (!rawClip || !engineLoaded) return false;
        var params = HuhAudio.mixParams(padX, padY, readCorners());
        var key = JSON.stringify(params);
        if (latestBuffer && latestKey === key) return false;
        try {
          latestBuffer = HuhAudio.renderHuh(rawClip, params);
          latestKey = key;
          useBlob(latestBuffer, swapNow);
          return true;
        } catch (e) {
          console.error(e);
          return false;
        }
      }

      function requestRender() {
        if (!rawClip) return Promise.resolve(null);
        var job = renderSerial.then(function () {
          return engineReady.then(function () {
            renderNow(false);
            return latestBuffer;
          });
        });
        renderSerial = job.then(function () {}, function () {});
        return job;
      }

      function scheduleRender() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(requestRender, 70);
      }

      function swapSrc(url, duration) {
        var previous = blobUrl;
        audio.src = url;
        blobUrl = url;
        soundDuration = duration || 0;
        if (previous) URL.revokeObjectURL(previous);
      }

      function flushQueued() {
        if (!queuedUrl) return;
        var url = queuedUrl;
        var duration = queuedDuration;
        queuedUrl = '';
        queuedDuration = 0;
        swapSrc(url, duration);
      }

      function useBlob(rendered, swapNow) {
        if (!rendered) return;
        var url = URL.createObjectURL(HuhAudio.encodeWav(rendered));
        if (!swapNow && !audio.paused && !audio.ended) {
          if (queuedUrl) URL.revokeObjectURL(queuedUrl);
          queuedUrl = url;
          queuedDuration = rendered.duration;
          return;
        }
        if (queuedUrl) URL.revokeObjectURL(queuedUrl);
        queuedUrl = '';
        queuedDuration = 0;
        swapSrc(url, rendered.duration);
      }

      // Length of the sound that is loaded right now. Known from the render,
      // so it is correct before the new file's metadata has loaded.
      function currentSoundDuration() {
        if (soundDuration > 0) return soundDuration;
        var d = audio.duration;
        return isFinite(d) && d > 0 ? d : 0;
      }

      function applyRate() {
        var picture = video.duration;
        var sound = currentSoundDuration();
        if (!(isFinite(picture) && picture > 0 && sound > 0)) return;
        var rate = picture / sound;
        if (isFinite(rate) && rate > 0) {
          baseRate = rate;
          video.playbackRate = rate;
        }
      }

      function onPlayClick() {
        var now = Date.now();
        if (now - playStamp < 350) return;
        playStamp = now;
        if (rafId) cancelAnimationFrame(rafId);
        rafId = 0;
        // Make sure the sound matches the dot before playing. A pending
        // render is done right here, inside the tap, instead of waiting.
        clearTimeout(debounceTimer);
        if (!renderNow(true)) flushQueued();
        active = true;
        waitingForSound = true;
        audio.pause();
        audio.currentTime = 0;
        video.pause();
        try { video.currentTime = 0; } catch (e0) {}
        video.muted = true;
        applyRate();
        var p;
        try {
          p = audio.play();
        } catch (err) {
          status.textContent = err && err.message ? err.message : String(err);
          active = false;
          waitingForSound = false;
          return;
        }
        status.textContent = '';
        if (p && typeof p.catch === 'function') {
          p.catch(function (err) {
            status.textContent = err && err.message ? err.message : String(err);
            active = false;
            video.pause();
            if (rafId) cancelAnimationFrame(rafId);
            rafId = 0;
          });
        }
        function frame() {
          if (!active) return;
          video.muted = true;
          if (audio.ended) {
            active = false;
            video.pause();
            rafId = 0;
            flushQueued();
            return;
          }
          if (!waitingForSound && isFinite(audio.currentTime) && !video.seeking) {
            var expected = audio.currentTime * baseRate;
            var drift = video.currentTime - expected;
            if (Math.abs(drift) > 0.03) {
              var remainSound = currentSoundDuration() - audio.currentTime;
              var remainPicture = video.duration - video.currentTime;
              if (remainSound > 0.04 && remainPicture > 0) {
                var catchRate = remainPicture / remainSound;
                if (isFinite(catchRate) && catchRate > 0) {
                  video.playbackRate = Math.min(4, Math.max(0.25, catchRate));
                }
              }
            } else if (Math.abs(video.playbackRate - baseRate) > 0.001) {
              video.playbackRate = baseRate;
            }
          }
          rafId = requestAnimationFrame(frame);
        }
        frame();
      }

      audio.addEventListener('ended', function () {
        active = false;
        if (rafId) cancelAnimationFrame(rafId);
        rafId = 0;
        video.pause();
        flushQueued();
      });
      audio.addEventListener('playing', function () {
        if (!active || !waitingForSound) return;
        waitingForSound = false;
        applyRate();
        var started = video.play();
        if (started && started.catch) started.catch(function (err) { console.error(err); });
      });
      audio.addEventListener('loadedmetadata', function () { if (active) applyRate(); });
      video.addEventListener('loadedmetadata', function () { if (active) applyRate(); });

      pad.addEventListener('pointerdown', function (e) {
        dragging = true;
        if (pad.setPointerCapture) pad.setPointerCapture(e.pointerId);
        pointFromEvent(e);
      });
      pad.addEventListener('pointermove', function (e) {
        if (!dragging) return;
        pointFromEvent(e);
      });
      function endDrag(e) {
        if (!dragging) return;
        dragging = false;
        if (e) pointFromEvent(e);
        requestRender();
      }
      pad.addEventListener('pointerup', endDrag);
      pad.addEventListener('pointercancel', endDrag);

      picks.forEach(function (b) {
        b.addEventListener('click', function () {
          var next = b.dataset.clip;
          var restart = active;
          if (next !== clip) {
            clip = next;
            picks.forEach(function (x) {
              x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
            });
            video.pause();
            video.src = '/clips/' + clip + '.mp4';
            video.load();
            video.muted = true;
          }
          if (restart) onPlayClick();
        });
      });

      var playButton = document.getElementById('play');
      playButton.addEventListener('click', onPlayClick);
      playButton.addEventListener('touchend', function (e) {
        if (e.cancelable) e.preventDefault();
        onPlayClick();
      });

      window.addEventListener('keydown', function (e) {
        if (e.key !== ' ' && e.code !== 'Space') return;
        if (e.repeat) return;
        var t = e.target;
        if (t) {
          var tag = (t.tagName || '').toLowerCase();
          var typ = (t.type || '').toLowerCase();
          if (tag === 'input' && typ !== 'range') return;
          if (tag === 'textarea' || tag === 'select' || t.isContentEditable) return;
        }
        e.preventDefault();
        onPlayClick();
      }, true);

      window.addEventListener('resize', placeDot);
      placeDot();
      Promise.all([bytesReady, engineReady]).then(function (parts) {
        return HuhAudio.decodeWavOffline(parts[0]);
      }).then(function (buf) {
        rawClip = buf;
        // Find the h|u boundary now, not inside the Play tap, when a corner uses u length.
        var corners = readCorners();
        var needsBoundary = false;
        if (corners) {
          for (var id in corners) {
            var c = corners[id];
            if (!c || typeof c !== 'object' || c.vowelScale === undefined) continue;
            var vs = Number(c.vowelScale);
            if (isFinite(vs) && vs !== 1) needsBoundary = true;
          }
        }
        if (needsBoundary) {
          try { HuhAudio.prepareClip(buf); } catch (e) { console.error(e); }
        }
        return requestRender();
      }).catch(function (err) {
        console.error(err);
        if (!status.textContent) status.textContent = err && err.message ? err.message : String(err);
      });
    })();
  </script>
</body>
</html>
