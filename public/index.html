<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Huuuh?</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: linear-gradient(160deg, #1a0533 0%, #0b1b3a 45%, #062018 100%);
      color: #fff;
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
    }
    main { text-align: center; padding: 1.5rem; }
    h1 {
      margin: 0 0 1rem;
      font-size: clamp(3.2rem, 13vw, 7.5rem); line-height: 0.9;
      letter-spacing: -0.03em; font-weight: 900;
      color: #fff;
      -webkit-text-stroke: 8px #000;
      paint-order: stroke fill;
    }
    video { width: min(92vw, 720px); border-radius: 12px; background: #000; display: block; margin: 0 auto; }
    .row { display: flex; gap: 0.6rem; justify-content: center; align-items: center; margin-top: 1rem; flex-wrap: wrap; }
    .clips { display: flex; gap: 0.45rem; }
    .clips button, #play {
      color: #111; background: #fff; border: 3px solid #000; cursor: pointer;
    }
    .clips button {
      width: 3.1rem; height: 3.1rem; border-radius: 10px;
      font: 900 1.35rem Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
    }
    .clips button[aria-pressed="true"], .clips button:hover, #play:hover { background: #ffe566; }
    #play {
      width: 4.2rem; height: 4.2rem; border-radius: 50%;
      display: inline-grid; place-items: center;
    }
    #play svg { width: 1.7rem; height: 1.7rem; margin-left: 0.15rem; }
    .pad-stage {
      width: min(92vw, 520px);
      margin: 1.15rem auto 0;
      display: grid;
      grid-template-columns: minmax(4.8rem, auto) minmax(168px, 260px) minmax(3.8rem, auto);
      grid-template-rows: auto auto auto;
      align-items: center;
      justify-content: center;
      column-gap: 0.5rem;
      row-gap: 0.35rem;
      font-family: system-ui, sans-serif;
      font-weight: 700;
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .edge-n { grid-column: 2; grid-row: 1; }
    .edge-w { grid-column: 1; grid-row: 2; }
    .edge-e { grid-column: 3; grid-row: 2; }
    .edge-s { grid-column: 2; grid-row: 3; }
    #pad {
      grid-column: 2;
      grid-row: 2;
      width: 100%;
      aspect-ratio: 1;
      position: relative;
      border: 3px solid #000;
      border-radius: 16px;
      background: rgba(255,255,255,0.08);
      touch-action: none;
      user-select: none;
      cursor: grab;
    }
    #dot {
      position: absolute;
      width: 26px;
      height: 26px;
      box-sizing: border-box;
      border-radius: 50%;
      background: #ffe566;
      border: 3px solid #000;
      transform: translate(-50%, -50%);
      left: 50%;
      top: 50%;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>HUUUH?</h1>
    <video id="huh" src="/clips/A.mp4" playsinline muted preload="auto"></video>
    <div class="row">
      <div class="clips" role="group" aria-label="Clip">
        <button type="button" data-clip="A" aria-pressed="true">A</button>
        <button type="button" data-clip="B" aria-pressed="false">B</button>
        <button type="button" data-clip="C" aria-pressed="false">C</button>
        <button type="button" data-clip="D" aria-pressed="false">D</button>
      </div>
      <button id="play" type="button" aria-label="Play">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
      </button>
    </div>
    <div class="pad-stage">
      <div class="edge-n">Shocked</div>
      <div class="edge-w">Unbothered</div>
      <div id="pad" aria-label="Mood. Left unbothered, right annoyed, down dry, up shocked.">
        <div id="dot"></div>
      </div>
      <div class="edge-e">Annoyed</div>
      <div class="edge-s">Dry</div>
    </div>
  </main>
  <script src="vendor/rubberband/rubberband.js?v=6"></script>
  <script src="js/huh-audio.js?v=12"></script>
  <script>
    (function () {
      var DOT = 26;
      var video = document.getElementById('huh');
      var pad = document.getElementById('pad');
      var dot = document.getElementById('dot');
      var picks = [].slice.call(document.querySelectorAll('.clips button'));
      var clip = 'A';
      var padX = 0;
      var padY = 0;
      var dragging = false;
      var active = false;
      var pendingStart = false;
      var rafId = 0;
      var sourceNode = null;
      var latestBuffer = null;
      var latestKey = '';
      var renderSerial = Promise.resolve();
      var debounceTimer = 0;
      var engineReadyFlag = false;
      var engineReady = HuhAudio.loadEngine('vendor/rubberband/rubberband.wasm').then(function () {
        engineReadyFlag = true;
      });
      var rawClip = null;
      var decoding = null;
      var bytesReady = HuhAudio.fetchWavBytes('audio/A.wav');

      video.muted = true;
      video.controls = false;

      function readCorners() {
        try {
          var raw = JSON.parse(localStorage.getItem('huh-corners') || 'null');
          if (raw && typeof raw === 'object') return raw;
        } catch (e) {}
        return null;
      }

      function clamp(v, lo, hi) {
        return v < lo ? lo : v > hi ? hi : v;
      }

      function placeDot() {
        var innerW = Math.max(1, pad.clientWidth - DOT);
        var innerH = Math.max(1, pad.clientHeight - DOT);
        var inset = DOT / 2;
        dot.style.left = (inset + ((padX + 1) / 2) * innerW) + 'px';
        dot.style.top = (inset + ((1 - padY) / 2) * innerH) + 'px';
      }

      function pointFromEvent(e) {
        var rect = pad.getBoundingClientRect();
        var style = window.getComputedStyle(pad);
        var borderL = parseFloat(style.borderLeftWidth) || 0;
        var borderT = parseFloat(style.borderTopWidth) || 0;
        var innerW = Math.max(1, pad.clientWidth - DOT);
        var innerH = Math.max(1, pad.clientHeight - DOT);
        var inset = DOT / 2;
        var localX = clamp(e.clientX - rect.left - borderL, inset, inset + innerW);
        var localY = clamp(e.clientY - rect.top - borderT, inset, inset + innerH);
        padX = clamp(((localX - inset) / innerW) * 2 - 1, -1, 1);
        padY = clamp(1 - ((localY - inset) / innerH) * 2, -1, 1);
        placeDot();
      }

      function requestRender() {
        if (!rawClip) return Promise.resolve(null);
        var job = renderSerial.then(function () {
          var params = HuhAudio.mixParams(padX, padY, readCorners());
          var key = JSON.stringify(params);
          if (latestBuffer && latestKey === key) return latestBuffer;
          return engineReady.then(function () {
            if (!rawClip) return latestBuffer;
            var fresh = HuhAudio.mixParams(padX, padY, readCorners());
            var freshKey = JSON.stringify(fresh);
            if (latestBuffer && latestKey === freshKey) return latestBuffer;
            try {
              latestBuffer = HuhAudio.renderHuh(rawClip, fresh);
              latestKey = freshKey;
            } catch (e) {
              console.error(e);
            }
            return latestBuffer;
          });
        });
        renderSerial = job.then(function () {}, function () {});
        return job;
      }

      function scheduleRender() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(requestRender, 70);
      }

      function haltPlayback() {
        if (rafId) cancelAnimationFrame(rafId);
        rafId = 0;
        if (sourceNode) {
          sourceNode.onended = null;
          try { sourceNode.stop(0); } catch (e) {}
          try { sourceNode.disconnect(); } catch (e2) {}
          sourceNode = null;
        }
        active = false;
        video.pause();
      }

      function ensureDecoded(ctx) {
        if (rawClip) return Promise.resolve(rawClip);
        if (decoding) return decoding;
        decoding = Promise.all([bytesReady, engineReady]).then(function (parts) {
          if (rawClip) return rawClip;
          return HuhAudio.decodeOnContext(ctx, parts[0]);
        }).then(function (decoded) {
          if (!rawClip) rawClip = decoded;
          return rawClip;
        }, function (err) {
          decoding = null;
          throw err;
        });
        return decoding;
      }

      function beginPicture(token, ctx, node, sound) {
        if (token !== HuhAudio.currentPlayToken()) return;
        if (rafId) cancelAnimationFrame(rafId);
        rafId = 0;
        sourceNode = node;
        active = true;
        pendingStart = true;
        video.muted = true;
        try { if (video.currentTime > 0.001) video.currentTime = 0; } catch (e0) {}
        var nominalRate = video.playbackRate || 1;
        var picture = video.duration;
        var rate = picture / sound;
        if (isFinite(picture) && picture > 0 && sound > 0 && isFinite(rate) && rate > 0) {
          video.playbackRate = rate;
          nominalRate = rate;
        } else {
          video.addEventListener('loadedmetadata', function onMeta() {
            video.removeEventListener('loadedmetadata', onMeta);
            if (token !== HuhAudio.currentPlayToken()) return;
            var next = video.duration / sound;
            if (isFinite(video.duration) && video.duration > 0 && sound > 0 && isFinite(next) && next > 0) {
              video.playbackRate = next;
              nominalRate = next;
            }
          });
        }
        var audioStart = ctx.currentTime;
        node.onended = function () {
          if (token !== HuhAudio.currentPlayToken()) return;
          active = false;
          pendingStart = false;
          if (rafId) cancelAnimationFrame(rafId);
          rafId = 0;
          video.pause();
          if (sourceNode === node) sourceNode = null;
        };
        var started = video.play();
        if (started && started.catch) started.catch(function (err) { console.error(err); });
        function frame() {
          if (token !== HuhAudio.currentPlayToken()) return;
          video.muted = true;
          var elapsed = ctx.currentTime - audioStart;
          if (!(sound > 0) || elapsed >= sound) {
            active = false;
            pendingStart = false;
            video.pause();
            rafId = 0;
            return;
          }
          if (elapsed >= 0 && !video.seeking) {
            var expected = elapsed * nominalRate;
            if (isFinite(expected) && Math.abs(video.currentTime - expected) > 0.04) {
              var remainSound = sound - elapsed;
              var remainPicture = video.duration - video.currentTime;
              if (remainSound > 0.04 && remainPicture > 0) {
                var catchRate = remainPicture / remainSound;
                if (isFinite(catchRate) && catchRate > 0) {
                  video.playbackRate = Math.min(4, Math.max(0.25, catchRate));
                }
              }
            }
          }
          rafId = requestAnimationFrame(frame);
        }
        frame();
      }

      function unlockVideo(token) {
        video.muted = true;
        var started = video.play();
        if (started && started.then) {
          started.then(function () {
            if (token !== HuhAudio.currentPlayToken() || !active) video.pause();
          }).catch(function () {});
        }
      }

      function playRenderedLater(token, ctx) {
        ensureDecoded(ctx).then(function (input) {
          if (!input || token !== HuhAudio.currentPlayToken()) return null;
          var params = HuhAudio.mixParams(padX, padY, readCorners());
          var rendered = HuhAudio.renderHuh(input, params);
          latestBuffer = rendered;
          latestKey = JSON.stringify(params);
          return HuhAudio.startBufferIfCurrent(token, rendered);
        }).then(function (again) {
          if (!again) return;
          beginPicture(again.token, again.ctx, again.source, again.duration);
        }).catch(function (err) {
          console.error(err);
          if (token !== HuhAudio.currentPlayToken()) return;
          active = false;
          pendingStart = false;
        });
      }

      function onPlayClick() {
        clearTimeout(debounceTimer);
        haltPlayback();
        pendingStart = true;
        var cached = null;
        var params = HuhAudio.mixParams(padX, padY, readCorners());
        var key = JSON.stringify(params);
        if (latestBuffer && latestKey === key) cached = latestBuffer;
        var result;
        try {
          result = HuhAudio.playBufferInGesture(cached);
        } catch (err) {
          console.error(err);
          pendingStart = false;
          return;
        }
        if (!result.silent) {
          beginPicture(result.token, result.ctx, result.source, result.duration);
          return;
        }
        if (rawClip && engineReadyFlag) {
          try {
            var fresh = HuhAudio.mixParams(padX, padY, readCorners());
            var rendered = HuhAudio.renderHuh(rawClip, fresh);
            latestBuffer = rendered;
            latestKey = JSON.stringify(fresh);
            var again = HuhAudio.startBufferIfCurrent(result.token, rendered);
            if (again) beginPicture(again.token, again.ctx, again.source, again.duration);
            return;
          } catch (err2) {
            console.error(err2);
          }
        }
        unlockVideo(result.token);
        playRenderedLater(result.token, result.ctx);
      }


      pad.addEventListener('pointerdown', function (e) {
        dragging = true;
        if (pad.setPointerCapture) pad.setPointerCapture(e.pointerId);
        pointFromEvent(e);
      });
      pad.addEventListener('pointermove', function (e) {
        if (!dragging) return;
        pointFromEvent(e);
      });
      function endDrag(e) {
        if (!dragging) return;
        dragging = false;
        if (e) pointFromEvent(e);
        scheduleRender();
      }
      pad.addEventListener('pointerup', endDrag);
      pad.addEventListener('pointercancel', endDrag);

      picks.forEach(function (b) {
        b.addEventListener('click', function () {
          var next = b.dataset.clip;
          var restart = active || pendingStart;
          if (next !== clip) {
            clip = next;
            picks.forEach(function (x) {
              x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
            });
            video.pause();
            video.src = '/clips/' + clip + '.mp4';
            video.load();
            video.muted = true;
          }
          if (restart) onPlayClick();
        });
      });

      document.getElementById('play').addEventListener('click', onPlayClick);

      window.addEventListener('resize', placeDot);
      placeDot();
      requestRender();
    })();
  </script>
</body>
</html>
