<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Huh?</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: linear-gradient(160deg, #1a0533 0%, #0b1b3a 45%, #062018 100%);
      color: #fff;
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
    }
    main { text-align: center; padding: 1.5rem; }
    h1 {
      margin: 0 0 1rem;
      font-size: clamp(4.5rem, 18vw, 9rem); line-height: 0.9;
      letter-spacing: -0.03em; font-weight: 900;
      color: #fff;
      -webkit-text-stroke: 8px #000;
      paint-order: stroke fill;
    }
    video { width: min(92vw, 720px); border-radius: 12px; background: #000; display: block; margin: 0 auto; }
    button {
      margin-top: 1rem;
      font: inherit; font-size: 1.4rem; letter-spacing: 0.04em;
      color: #fff; background: #111; border: 3px solid #fff;
      border-radius: 999px; padding: 0.45rem 1.4rem; cursor: pointer;
    }
    button:hover { background: #fff; color: #111; }
  </style>
</head>
<body>
  <main>
    <h1>HUH?</h1>
    <video id="huh" src="/clips/A.mp4" playsinline controls></video>
    <button id="replay" type="button">replay</button>
  </main>
  <script>
    const v = document.getElementById("huh");
    const play = () => { v.currentTime = 0; v.muted = false; v.play(); };
    document.getElementById("replay").addEventListener("click", play);
    window.addEventListener("load", () => setTimeout(play, 800));
  </script>
</body>
</html>
