<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Huh?</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: linear-gradient(160deg, #1a0533 0%, #0b1b3a 45%, #062018 100%);
      color: #fff;
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
    }
    main { text-align: center; padding: 1.5rem; }
    h1 {
      margin: 0 0 1rem;
      font-size: clamp(4.5rem, 18vw, 9rem); line-height: 0.9;
      letter-spacing: -0.03em; font-weight: 900;
      color: #fff;
      -webkit-text-stroke: 8px #000;
      paint-order: stroke fill;
    }
    video { width: min(92vw, 720px); border-radius: 12px; background: #000; display: block; margin: 0 auto; }
    button {
      margin-top: 1rem;
      width: 4.2rem; height: 4.2rem; border-radius: 50%;
      color: #111; background: #fff; border: 3px solid #000;
      cursor: pointer; display: inline-grid; place-items: center;
    }
    button svg { width: 1.7rem; height: 1.7rem; margin-left: 0.15rem; }
    button:hover { background: #ffe566; }
  </style>
</head>
<body>
  <main>
    <h1>HUH?</h1>
    <video id="huh" src="/clips/A.mp4" playsinline controls></video>
    <button id="play" type="button" aria-label="Play">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>
    </button>
  </main>
  <script>
    const v = document.getElementById("huh");
    document.getElementById("play").addEventListener("click", () => {
      v.muted = false;
      v.currentTime = 0;
      v.play();
    });
  </script>
</body>
</html>
