</head>
<body class="player">
  <h1 class="sr-only">HUUUH? Someone sent you a huh</h1>
  <main class="blk y">
    <div class="inner">
      <div class="stage" id="stage" title="Play">
        <video id="huh" src="/clips/A.mp4" poster="/clips/A.jpg?v=1" width="1280" height="720" playsinline muted preload="auto"></video>
        <img class="still" id="still" src="/clips/A.jpg?v=1" width="1280" height="720" alt="" aria-hidden="true">
        <script>
          (function () {
            var m = /[?&]h=1([A-DG])/.exec(location.search);
            if (m && m[1] !== 'A') {
              var v = document.getElementById('huh');
              var cv = m[1] === 'G' ? 2 : 1; // per-clip cache-bust, = CLIP_V in huh-meme.js
              v.src = '/clips/' + m[1] + '.mp4' + (cv > 1 ? '?v=' + cv : '');
              v.poster = document.getElementById('still').src = '/clips/' + m[1] + '.jpg?v=' + cv;
            }
          })();
        </script>
        <p class="caption meme top right" id="caption" aria-hidden="true"></p>
      </div>
      <audio id="voice" playsinline webkit-playsinline preload="auto" src="audio/A.wav"></audio>
      <button id="play" type="button" aria-label="Play"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 4.5v15l12.5-7.5z"/></svg><span>Play</span></button>
      <p id="status" role="alert"></p>
      <p class="make"><a id="make" href="/">Make your own</a></p>
    </div>
  </main>
  <script src="vendor/rubberband/rubberband.js?v=10"></script>
  <script src="js/huh-vowel.js?v=3"></script>
  <script src="js/huh-audio.js?v=24"></script>
  <script src="js/huh-presets.js?v=6"></script>
  <script src="js/huh-meme.js?v=14"></script>
  <script>
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      var shared = HuhMeme.codeFromLocation();
      var state = shared || { clip: 'A', presetId: 'original', basedOn: null, params: HuhAudio.normalizeParams({}) };
      var player = HuhMeme.create({
        video: $('huh'),
        audio: $('voice'),
        caption: $('caption'),
        stage: $('stage'),
        captionBeforePlay: true,
        getParams: function () { return state.params; },
        onStatus: function (t) { $('status').textContent = t; },
        onPlayState: function (on) { document.body.classList.toggle('is-playing', on); }
      });
      player.setClip(state.clip);
      // Back to the full page with the same sound and cat.
      if (shared) $('make').href = '/?h=' + HuhMeme.encode(state);
      window.HuhPage = { player: player, state: function () { return state; } };

      function nameFor(presets) {
        var p = null;
        var id = state.presetId || state.basedOn;
        for (var i = 0; i < presets.length; i++) if (presets[i].id === id) p = presets[i];
        // The egg (gag clip G) is never Classic: its plain sound is the blaaah.
        if (state.clip === HuhMeme.EGG_CLIP) return state.presetId && p ? p.label : 'Custom blaaah';
        if (state.presetId === 'original' || HuhMeme.sameParams(state.params, {})) return HuhPresets.PLAIN_LABEL;
        if (state.presetId && p) return p.label;
        return 'Custom huh';
      }
      var presetsReady = HuhPresets.load('presets.json').then(function (r) {
        var data = r.base || {};
        player.setClipText(data.clips || {});
        document.title = 'HUUUH? \u2014 ' + nameFor(data.presets || []);
      }, function (err) {
        console.error(err);
        document.title = 'HUUUH? \u2014 ' + (HuhMeme.sameParams(state.params, {}) ? HuhPresets.PLAIN_LABEL : 'Custom huh');
      });
      Promise.all([player.rawReady, presetsReady]).then(function () {
        player.renderNow(false);
      }).catch(function (err) {
        console.error(err);
        $('status').textContent = err && err.message ? err.message : String(err);
      });

      var play = function () { player.play(); };
      var btn = $('play');
      btn.addEventListener('click', play);
      btn.addEventListener('touchend', function (e) { if (e.cancelable) e.preventDefault(); play(); });
      $('stage').addEventListener('click', play);
      HuhPresets.spaceToPlay(play);
    })();
  </script>
</body>
</html>
