<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HUUUH?</title>
  <meta name="description" content="Someone sent you a huh. Tap to play." />
  <meta name="theme-color" content="#000000" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="huuuh.meme" />
  <meta property="og:title" content="HUUUH?" />
  <meta property="og:description" content="Someone sent you a huh. Tap to play." />
  <meta property="og:image" content="https://huuuh.meme/og.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preload" href="fonts/anton/anton-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/macro.css?v=1" />
</head>
<body class="player-page">
  <main class="page">
    <section class="macro" aria-label="The meme">
      <h1 class="mtext top-text"><a href="/" class="home">HUUUH?</a></h1>
      <div class="stage" id="stage" title="Play">
        <video id="huh" src="/clips/A.mp4" width="1280" height="720" playsinline muted preload="auto"></video>
        <script>
          (function () {
            var m = /[?&]h=1([A-D])/.exec(location.search);
            if (m && m[1] !== 'A') document.getElementById('huh').src = '/clips/' + m[1] + '.mp4';
          })();
        </script>
        <p class="caption meme top right" id="caption" aria-hidden="true"></p>
      </div>
      <p class="mtext bottom-text" id="bottom-text">&nbsp;</p>
    </section>
    <audio id="voice" playsinline webkit-playsinline preload="auto" src="audio/A.wav"></audio>
    <button id="play" class="big-play" type="button" aria-label="Play"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 4.5v15l12.5-7.5z"/></svg><span>Play</span></button>
    <p id="status" role="alert"></p>
    <p class="make"><a id="make" href="/">Make your own <span aria-hidden="true">&rarr;</span></a></p>
  </main>
  <script src="vendor/rubberband/rubberband.js?v=9"></script>
  <script src="js/huh-vowel.js?v=1"></script>
  <script src="js/huh-audio.js?v=20"></script>
  <script src="js/huh-presets.js?v=3"></script>
  <script src="js/huh-meme.js?v=1"></script>
  <script>
    (function () {
      var $ = function (id) { return document.getElementById(id); };
      var shared = HuhMeme.codeFromLocation();
      var state = shared || { clip: 'A', presetId: 'original', basedOn: null, params: HuhAudio.normalizeParams({}) };
      var bottom = $('bottom-text');
      var player = HuhMeme.create({
        video: $('huh'),
        audio: $('voice'),
        caption: $('caption'),
        stage: $('stage'),
        captionBeforePlay: true,
        getParams: function () { return state.params; },
        onStatus: function (t) { $('status').textContent = t; },
        onPlayState: function (on) { document.body.classList.toggle('is-playing', on); }
      });
      player.setClip(state.clip);
      // Back to the full page with the same sound and cat.
      if (shared) $('make').href = '/?h=' + HuhMeme.encode(state);
      window.HuhPage = { player: player, state: function () { return state; } };

      function nameFor(presets) {
        var p = null;
        var id = state.presetId || state.basedOn;
        for (var i = 0; i < presets.length; i++) if (presets[i].id === id) p = presets[i];
        if (state.presetId === 'original' || HuhMeme.sameParams(state.params, {})) return 'Original huh';
        if (state.presetId && p) return p.label;
        return 'Custom huh';
      }
      var presetsReady = HuhPresets.load('presets.json').then(function (r) {
        var data = r.base || {};
        player.setClipText(data.clips || {});
        bottom.textContent = nameFor(data.presets || []).toUpperCase();
        document.title = 'HUUUH? \u2014 ' + nameFor(data.presets || []);
      }, function (err) {
        console.error(err);
        bottom.textContent = HuhMeme.sameParams(state.params, {}) ? 'ORIGINAL HUH' : 'CUSTOM HUH';
      });
      Promise.all([player.rawReady, presetsReady]).then(function () {
        player.renderNow(false);
      }).catch(function (err) {
        console.error(err);
        $('status').textContent = err && err.message ? err.message : String(err);
      });

      var play = function () { player.play(); };
      var btn = $('play');
      btn.addEventListener('click', play);
      btn.addEventListener('touchend', function (e) { if (e.cancelable) e.preventDefault(); play(); });
      $('stage').addEventListener('click', play);
      window.addEventListener('keydown', function (e) {
        if (e.key !== ' ' && e.code !== 'Space') return;
        if (e.repeat) return;
        var t = e.target;
        var kb = false;
        try { kb = t && t.matches && t.matches(':focus-visible'); } catch (err) {}
        if (t && t.tagName === 'A' && kb) return;
        e.preventDefault();
        play();
      }, true);
    })();
  </script>
</body>
</html>
