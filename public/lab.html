<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>huh lab</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #121212;
      color: #e6e6e6;
      font: 15px/1.4 system-ui, sans-serif;
    }
    main { max-width: 680px; margin: 0 auto; padding: 1.25rem 1rem 2rem; }
    h1 { font-size: 1.15rem; font-weight: 650; margin: 0 0 0.9rem; letter-spacing: 0.01em; }
    .row {
      display: grid;
      grid-template-columns: 9.5rem 1fr 4.2rem;
      gap: 0.6rem;
      align-items: center;
      margin: 0.35rem 0;
    }
    .row span { font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; accent-color: #8fd3ff; }
    output { text-align: right; font-variant-numeric: tabular-nums; color: #cfe8f6; }
    canvas {
      display: block;
      width: 100%;
      height: 220px;
      margin: 0.9rem 0 0.8rem;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
    }
    .actions { display: flex; gap: 0.5rem; align-items: center; }
    .actions button {
      background: #1e1e1e;
      color: #eee;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      cursor: pointer;
      padding: 0.45rem 0.9rem;
      font: inherit;
    }
    #play { background: #243628; border-color: #6a9a74; }
    #status { margin: 0.7rem 0 0; min-height: 1.2em; color: #999; font-size: 0.9rem; }
    #voice { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .check {
      display: flex; align-items: center; gap: 0.5rem;
      margin: 0 0 0.7rem; cursor: pointer;
    }
    .hint { margin: 0.2rem 0 0.6rem; color: #9a9a9a; font-size: 0.85rem; }
    .corners {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.45rem;
      margin: 0.85rem 0 0.15rem;
    }
    .corners button {
      background: #1e1e1e;
      color: #eee;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      cursor: pointer;
      padding: 0.45rem 0.55rem;
      font: inherit;
    }
    .corners button:hover { border-color: #6a9a74; }
  </style>
</head>
<body>
  <main>
    <h1>huh lab</h1>
    <label class="check"><input type="checkbox" id="keepVowel" /> Keep vowel</label>
    <div id="params"></div>
    <div class="corners" role="group" aria-label="Save corner">
      <button type="button" data-corner="unbotheredShocked">Unbothered + Shocked</button>
      <button type="button" data-corner="annoyedShocked">Annoyed + Shocked</button>
      <button type="button" data-corner="unbotheredDry">Unbothered + Dry</button>
      <button type="button" data-corner="annoyedDry">Annoyed + Dry</button>
    </div>
    <p class="hint">The diagram is the sound Play will use. The filled shape is the waveform, the blue line is the pitch, and the orange line is attack and accent.</p>
    <canvas id="diagram" width="640" height="220" aria-label="waveform and pitch"></canvas>
    <audio id="voice" playsinline webkit-playsinline preload="auto" src="audio/A.wav"></audio>
    <div class="actions">
      <button type="button" id="play">Play</button>
      <button type="button" id="reset">Reset</button>
    </div>
    <p id="status"></p>
  </main>
  <script src="vendor/rubberband/rubberband.js?v=7"></script>
  <script src="js/huh-audio.js?v=14"></script>
  <script>
    (function () {
      var FIELDS = [
        ['pitchSemitones', 1, 'pitchSemitones', '0.1'],
        ['durationScale', 2, 'durationScale', '0.01'],
        ['peakAt', 2, 'peakAt', '0.01'],
        ['riseSemitones', 1, 'riseSemitones', '0.1'],
        ['fallSemitones', 1, 'fallSemitones', '0.1'],
        ['gainDb', 1, 'gainDb', '0.1'],
        ['attackMs', 0, 'Attack', '1'],
        ['accent', 2, 'Accent', '0.01']
      ];
      var rawClip = null;
      var decoding = null;
      var engineReadyFlag = false;
      var CORNER_IDS = ['unbotheredDry', 'annoyedDry', 'unbotheredShocked', 'annoyedShocked'];
      var CORNER_LABELS = {
        unbotheredDry: 'Unbothered + Dry',
        annoyedDry: 'Annoyed + Dry',
        unbotheredShocked: 'Unbothered + Shocked',
        annoyedShocked: 'Annoyed + Shocked'
      };
      var corners = loadCorners();

      function blankCorner() {
        var params = {};
        FIELDS.forEach(function (field) {
          params[field[0]] = HuhAudio.DEFAULTS[field[0]];
        });
        return params;
      }

      function copyCorner(src) {
        var params = blankCorner();
        if (!src) return params;
        FIELDS.forEach(function (field) {
          var n = Number(src[field[0]]);
          if (isFinite(n)) params[field[0]] = n;
        });
        return params;
      }

      function loadCorners() {
        var stored = {};
        try {
          stored = JSON.parse(localStorage.getItem('huh-corners') || 'null') || {};
        } catch (e) {
          stored = {};
        }
        var out = {};
        CORNER_IDS.forEach(function (id) {
          out[id] = copyCorner(stored[id]);
        });
        return out;
      }

      function cornerPayload() {
        var out = {};
        CORNER_IDS.forEach(function (id) {
          out[id] = copyCorner(corners[id]);
        });
        return out;
      }
      var box = document.getElementById('params');
      var status = document.getElementById('status');
      var audio = document.getElementById('voice');
      var blobUrl = '';
      var queuedUrl = '';
      var playStamp = 0;
      if (!audio.getAttribute('src')) audio.src = 'audio/A.wav';
      var engineReady = HuhAudio.loadEngine('vendor/rubberband/rubberband.wasm');
      var bytesReady = HuhAudio.fetchWavBytes('audio/A.wav');
      Promise.all([bytesReady, engineReady]).then(function (parts) {
        engineReadyFlag = true;
        if (!status.textContent) status.textContent = 'ready';
        return HuhAudio.decodeWavOffline(parts[0]);
      }).then(function (buf) {
        rawClip = buf;
        scheduleRender();
      }).catch(function (err) {
        status.textContent = err && err.message ? err.message : 'Rubber Band failed to load';
      });

      FIELDS.forEach(function (field) {
        var name = field[0];
        var range = HuhAudio.RANGES[name];
        var row = document.createElement('label');
        row.className = 'row';
        var title = document.createElement('span');
        title.textContent = field[2];
        var slider = document.createElement('input');
        slider.type = 'range';
        slider.id = name;
        slider.min = String(range[0]);
        slider.max = String(range[1]);
        slider.step = field[3];
        slider.value = String(HuhAudio.DEFAULTS[name]);
        var out = document.createElement('output');
        out.id = name + '-out';
        out.textContent = format(name, HuhAudio.DEFAULTS[name]);
        row.appendChild(title);
        row.appendChild(slider);
        row.appendChild(out);
        box.appendChild(row);
        slider.addEventListener('input', function () {
          out.textContent = format(name, Number(slider.value));
          draw();
          scheduleRender();
        });
      });

      function format(name, value) {
        var digits = 1;
        for (var i = 0; i < FIELDS.length; i++) {
          if (FIELDS[i][0] === name) digits = FIELDS[i][1];
        }
        return Number(value).toFixed(digits);
      }

      function readParams() {
        var params = {};
        FIELDS.forEach(function (field) {
          params[field[0]] = Number(document.getElementById(field[0]).value);
        });
        params.keepVowel = document.getElementById('keepVowel').checked;
        return params;
      }


      var renderGen = 0;
      var pending = null;
      var latestBuffer = null;
      var latestKey = '';
      var lastWave = null;

      function paramsKey(params) {
        return JSON.stringify(params);
      }

      function scheduleRender() {
        if (!rawClip || !engineReadyFlag) return Promise.resolve(null);
        var params = readParams();
        var key = paramsKey(params);
        if (latestBuffer && key === latestKey) return Promise.resolve(latestBuffer);
        if (pending && pending.key === key) return pending.promise;
        var gen = ++renderGen;
        var promise = engineReady.then(function () {
          if (!rawClip || gen !== renderGen) return null;
          var rendered = HuhAudio.renderHuh(rawClip, params);
          if (gen !== renderGen) return null;
          latestBuffer = rendered;
          latestKey = key;
          lastWave = new Float32Array(rendered.getChannelData(0));
          draw();
          useBlob(rendered);
          return rendered;
        });
        pending = { key: key, promise: promise };
        promise.then(function () {
          if (pending && pending.key === key) pending = null;
        }, function () {
          if (pending && pending.key === key) pending = null;
        });
        return promise;
      }

      function draw() {
        var canvas = document.getElementById('diagram');
        var cssW = canvas.clientWidth || 640;
        var cssH = canvas.clientHeight || 220;
        var dpr = window.devicePixelRatio || 1;
        canvas.width = Math.max(1, Math.round(cssW * dpr));
        canvas.height = Math.max(1, Math.round(cssH * dpr));
        var g = canvas.getContext('2d');
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
        var w = cssW;
        var h = cssH;
        g.clearRect(0, 0, w, h);
        g.fillStyle = '#1a1a1a';
        g.fillRect(0, 0, w, h);

        var params = readParams();
        var steps = 240;
        var ys = new Array(steps + 1);
        var yMin = 0;
        var yMax = 0;
        for (var i = 0; i <= steps; i++) {
          var t = i / steps;
          var y = params.pitchSemitones + HuhAudio.contourAt(t, params);
          ys[i] = y;
          if (y < yMin) yMin = y;
          if (y > yMax) yMax = y;
        }
        var pad = Math.max(1, (yMax - yMin) * 0.12);
        yMin -= pad;
        yMax += pad;
        var span = yMax - yMin || 1;
        var left = 36;
        var right = 10;
        var top = 16;
        var bottom = 16;
        var plotW = Math.max(1, w - left - right);
        var plotH = Math.max(1, h - top - bottom);
        var mid = top + plotH / 2;

        function xOf(t) { return left + t * plotW; }
        function yOf(v) { return top + (yMax - v) / span * plotH; }

        if (lastWave && lastWave.length) {
          var n = lastWave.length;
          g.strokeStyle = '#3d5c73';
          g.lineWidth = 1;
          g.beginPath();
          for (var x = 0; x < plotW; x++) {
            var i0 = Math.floor(x / plotW * n);
            var i1 = Math.max(i0 + 1, Math.floor((x + 1) / plotW * n));
            var lo = 0, hi = 0;
            for (var s = i0; s < i1 && s < n; s++) {
              var sample = lastWave[s];
              if (sample < lo) lo = sample;
              if (sample > hi) hi = sample;
            }
            var px = left + x + 0.5;
            g.moveTo(px, mid - hi * (plotH * 0.48));
            g.lineTo(px, mid - lo * (plotH * 0.48));
          }
          g.stroke();
        }

        g.strokeStyle = '#333';
        g.lineWidth = 1;
        g.beginPath();
        g.moveTo(left, yOf(0));
        g.lineTo(left + plotW, yOf(0));
        g.stroke();

        g.fillStyle = '#888';
        g.font = '11px system-ui, sans-serif';
        g.textAlign = 'right';
        g.textBaseline = 'middle';
        g.fillText(yMax.toFixed(1), left - 4, yOf(yMax));
        g.fillText(yMin.toFixed(1), left - 4, yOf(yMin));

        g.strokeStyle = '#8fd3ff';
        g.lineWidth = 2;
        g.beginPath();
        for (var k = 0; k <= steps; k++) {
          var px2 = xOf(k / steps);
          var py = yOf(ys[k]);
          if (k === 0) g.moveTo(px2, py);
          else g.lineTo(px2, py);
        }
        g.stroke();

        g.strokeStyle = '#ffb15e';
        g.lineWidth = 2;
        g.beginPath();
        var dur = Math.max(0.05, (lastWave ? lastWave.length / 44100 : 0.39));
        for (var e = 0; e <= steps; e++) {
          var et = e / steps;
          var env = HuhAudio.envelopeAt(et, params, dur);
          var ex = xOf(et);
          var ey = top + (1 - env) * plotH;
          if (e === 0) g.moveTo(ex, ey);
          else g.lineTo(ex, ey);
        }
        g.stroke();

        var peakX = xOf(params.peakAt);
        var peakY = yOf(params.pitchSemitones + HuhAudio.contourAt(params.peakAt, params));
        g.fillStyle = '#ffe566';
        g.beginPath();
        g.arc(peakX, peakY, 3.5, 0, Math.PI * 2);
        g.fill();
      }

      document.getElementById('keepVowel').addEventListener('change', function () {
        draw();
        scheduleRender();
      });

      function swapSrc(url) {
        var previous = blobUrl;
        audio.src = url;
        blobUrl = url;
        if (previous) URL.revokeObjectURL(previous);
      }

      function useBlob(rendered) {
        if (!rendered) return;
        var url = URL.createObjectURL(HuhAudio.encodeWav(rendered));
        if (!audio.paused && !audio.ended) {
          if (queuedUrl) URL.revokeObjectURL(queuedUrl);
          queuedUrl = url;
          return;
        }
        swapSrc(url);
      }

      audio.addEventListener('ended', function () {
        if (!queuedUrl) return;
        var url = queuedUrl;
        queuedUrl = '';
        swapSrc(url);
      });

      function onPlayClick() {
        var now = Date.now();
        if (now - playStamp < 350) return;
        playStamp = now;
        audio.currentTime = 0;
        var p;
        try {
          p = audio.play();
        } catch (err) {
          status.textContent = err && err.message ? err.message : String(err);
          return;
        }
        status.textContent = 'playing';
        if (p && typeof p.catch === 'function') {
          p.catch(function (err) {
            status.textContent = err && err.message ? err.message : String(err);
          });
        }
      }

      var playButton = document.getElementById('play');
      playButton.addEventListener('click', onPlayClick);
      playButton.addEventListener('touchend', function (e) {
        if (e.cancelable) e.preventDefault();
        onPlayClick();
      });

      document.getElementById('reset').addEventListener('click', function () {
        FIELDS.forEach(function (field) {
          var name = field[0];
          document.getElementById(name).value = String(HuhAudio.DEFAULTS[name]);
          document.getElementById(name + '-out').textContent = format(name, HuhAudio.DEFAULTS[name]);
        });
        document.getElementById('keepVowel').checked = !!HuhAudio.DEFAULTS.keepVowel;
        draw();
        scheduleRender();
      });

      document.querySelectorAll('.corners button').forEach(function (button) {
        button.addEventListener('click', function () {
          var id = button.getAttribute('data-corner');
          var current = readParams();
          var stored = {};
          FIELDS.forEach(function (field) {
            stored[field[0]] = current[field[0]];
          });
          corners[id] = stored;
          try {
            localStorage.setItem('huh-corners', JSON.stringify(cornerPayload()));
            status.textContent = 'Saved ' + CORNER_LABELS[id];
          } catch (err) {
            status.textContent = 'Could not save corners';
          }
        });
      });

      window.addEventListener('resize', draw);
      draw();
    })();
  </script>
</body>
</html>
