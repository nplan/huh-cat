<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>huh lab</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #121212;
      color: #e6e6e6;
      font: 15px/1.4 system-ui, sans-serif;
    }
    main { max-width: 680px; margin: 0 auto; padding: 1.25rem 1rem 2rem; }
    h1 { font-size: 1.15rem; font-weight: 650; margin: 0 0 0.9rem; letter-spacing: 0.01em; }
    .row {
      display: grid;
      grid-template-columns: 9.5rem 1fr 4.2rem;
      gap: 0.6rem;
      align-items: center;
      margin: 0.35rem 0;
    }
    .row span { font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; accent-color: #8fd3ff; }
    output { text-align: right; font-variant-numeric: tabular-nums; color: #cfe8f6; }
    canvas {
      display: block;
      width: 100%;
      height: 160px;
      margin: 0.9rem 0 0.8rem;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
    }
    .actions { display: flex; gap: 0.5rem; align-items: center; }
    .actions button {
      background: #1e1e1e;
      color: #eee;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      cursor: pointer;
      padding: 0.45rem 0.9rem;
      font: inherit;
    }
    #wave { height: 120px; margin-top: 0; }
    #play { background: #243628; border-color: #6a9a74; }
    #status { margin: 0.7rem 0 0; min-height: 1.2em; color: #999; font-size: 0.9rem; }
    .check {
      display: flex; align-items: center; gap: 0.5rem;
      margin: 0 0 0.7rem; cursor: pointer;
    }
    .hint { margin: 0.2rem 0 0.6rem; color: #9a9a9a; font-size: 0.85rem; }
  </style>
</head>
<body>
  <main>
    <h1>huh lab</h1>
    <label class="check"><input type="checkbox" id="keepVowel" checked /> Keep vowel</label>
    <div id="params"></div>
    <p class="hint">Press Play after you move a slider. Attack is how long the fade-in lasts, up to 400 ms. Accent keeps only the peak and silences the rest.</p>
    <canvas id="contour" width="640" height="160" aria-label="pitch contour in semitones"></canvas>
    <canvas id="wave" width="640" height="120" aria-label="waveform"></canvas>
    <div class="actions">
      <button type="button" id="play">Play</button>
      <button type="button" id="reset">Reset</button>
    </div>
    <p id="status"></p>
  </main>
  <script src="vendor/rubberband/rubberband.js"></script>
  <script src="js/huh-audio.js?v=4"></script>
  <script>
    (function () {
      var FIELDS = [
        ['pitchSemitones', 1, 'pitchSemitones', '0.1'],
        ['durationScale', 2, 'durationScale', '0.01'],
        ['peakAt', 2, 'peakAt', '0.01'],
        ['riseSemitones', 1, 'riseSemitones', '0.1'],
        ['fallSemitones', 1, 'fallSemitones', '0.1'],
        ['gainDb', 1, 'gainDb', '0.1'],
        ['attackMs', 0, 'Attack', '1'],
        ['accent', 2, 'Accent', '0.01']
      ];
      var playSeq = 0;
      var clipReady = null;
      var box = document.getElementById('params');
      var status = document.getElementById('status');
      var engineReady = HuhAudio.loadEngine('vendor/rubberband/rubberband.wasm');
      engineReady.then(function () {
        if (!status.textContent) status.textContent = 'ready';
      }).catch(function (err) {
        status.textContent = err && err.message ? err.message : 'Rubber Band failed to load';
      });

      FIELDS.forEach(function (field) {
        var name = field[0];
        var range = HuhAudio.RANGES[name];
        var row = document.createElement('label');
        row.className = 'row';
        var title = document.createElement('span');
        title.textContent = field[2];
        var slider = document.createElement('input');
        slider.type = 'range';
        slider.id = name;
        slider.min = String(range[0]);
        slider.max = String(range[1]);
        slider.step = field[3];
        slider.value = String(HuhAudio.DEFAULTS[name]);
        var out = document.createElement('output');
        out.id = name + '-out';
        out.textContent = format(name, HuhAudio.DEFAULTS[name]);
        row.appendChild(title);
        row.appendChild(slider);
        row.appendChild(out);
        box.appendChild(row);
        slider.addEventListener('input', function () {
          out.textContent = format(name, Number(slider.value));
          draw();
        });
      });

      function format(name, value) {
        var digits = 1;
        for (var i = 0; i < FIELDS.length; i++) {
          if (FIELDS[i][0] === name) digits = FIELDS[i][1];
        }
        return Number(value).toFixed(digits);
      }

      function readParams() {
        var params = {};
        FIELDS.forEach(function (field) {
          params[field[0]] = Number(document.getElementById(field[0]).value);
        });
        params.keepVowel = document.getElementById('keepVowel').checked;
        return params;
      }


      var lastWave = null;

      function drawWave(samples) {
        lastWave = samples || lastWave;
        var canvas = document.getElementById('wave');
        var cssW = canvas.clientWidth || 640;
        var cssH = canvas.clientHeight || 120;
        var dpr = window.devicePixelRatio || 1;
        canvas.width = Math.max(1, Math.round(cssW * dpr));
        canvas.height = Math.max(1, Math.round(cssH * dpr));
        var g = canvas.getContext('2d');
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
        g.clearRect(0, 0, cssW, cssH);
        g.fillStyle = '#1a1a1a';
        g.fillRect(0, 0, cssW, cssH);
        g.strokeStyle = '#333';
        g.beginPath();
        g.moveTo(0, cssH / 2);
        g.lineTo(cssW, cssH / 2);
        g.stroke();
        g.fillStyle = '#9a9a9a';
        g.font = '11px system-ui, sans-serif';
        g.fillText(lastWave ? 'waveform' : 'waveform (press Play)', 8, 14);
        if (!lastWave || !lastWave.length) return;
        var n = lastWave.length;
        var mid = cssH / 2;
        g.strokeStyle = '#d7ecff';
        g.lineWidth = 1;
        g.beginPath();
        for (var x = 0; x < cssW; x++) {
          var i0 = Math.floor(x / cssW * n);
          var i1 = Math.max(i0 + 1, Math.floor((x + 1) / cssW * n));
          var lo = 0, hi = 0;
          for (var i = i0; i < i1 && i < n; i++) {
            var s = lastWave[i];
            if (s < lo) lo = s;
            if (s > hi) hi = s;
          }
          var y1 = mid - hi * (mid - 8);
          var y2 = mid - lo * (mid - 8);
          g.moveTo(x + 0.5, y1);
          g.lineTo(x + 0.5, y2);
        }
        g.stroke();
      }

      function draw() {
        var canvas = document.getElementById('contour');
        var cssW = canvas.clientWidth || 640;
        var cssH = canvas.clientHeight || 180;
        var dpr = window.devicePixelRatio || 1;
        canvas.width = Math.max(1, Math.round(cssW * dpr));
        canvas.height = Math.max(1, Math.round(cssH * dpr));
        var g = canvas.getContext('2d');
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
        var w = cssW;
        var h = cssH;
        g.clearRect(0, 0, w, h);
        g.fillStyle = '#1a1a1a';
        g.fillRect(0, 0, w, h);

        var params = readParams();
        var steps = 240;
        var ys = new Array(steps + 1);
        var yMin = 0;
        var yMax = 0;
        for (var i = 0; i <= steps; i++) {
          var t = i / steps;
          var y = params.pitchSemitones + HuhAudio.contourAt(t, params);
          ys[i] = y;
          if (y < yMin) yMin = y;
          if (y > yMax) yMax = y;
        }
        var pad = Math.max(1, (yMax - yMin) * 0.12);
        yMin -= pad;
        yMax += pad;
        var span = yMax - yMin || 1;
        var left = 36;
        var right = 10;
        var top = 12;
        var bottom = 22;
        var plotW = Math.max(1, w - left - right);
        var plotH = Math.max(1, h - top - bottom);

        function xOf(t) { return left + t * plotW; }
        function yOf(v) { return top + (yMax - v) / span * plotH; }

        g.strokeStyle = '#333';
        g.lineWidth = 1;
        g.beginPath();
        g.moveTo(left, yOf(0));
        g.lineTo(left + plotW, yOf(0));
        g.stroke();

        g.fillStyle = '#888';
        g.font = '11px system-ui, sans-serif';
        g.textAlign = 'right';
        g.textBaseline = 'middle';
        g.fillText(yMax.toFixed(1), left - 4, yOf(yMax));
        g.fillText(yMin.toFixed(1), left - 4, yOf(yMin));
        g.textAlign = 'left';
        g.textBaseline = 'top';
        g.fillText('semitones', left, 0);

        g.strokeStyle = '#8fd3ff';
        g.lineWidth = 2;
        g.beginPath();
        for (var s = 0; s <= steps; s++) {
          var px = xOf(s / steps);
          var py = yOf(ys[s]);
          if (s === 0) g.moveTo(px, py);
          else g.lineTo(px, py);
        }
        g.stroke();

        g.strokeStyle = '#ffb15e';
        g.lineWidth = 2;
        g.beginPath();
        var dur = 0.39 * params.durationScale;
        for (var e = 0; e <= steps; e++) {
          var et = e / steps;
          var env = HuhAudio.envelopeAt(et, params, dur);
          var ex = xOf(et);
          var ey = top + (1 - env) * plotH;
          if (e === 0) g.moveTo(ex, ey);
          else g.lineTo(ex, ey);
        }
        g.stroke();

        var peakX = xOf(params.peakAt);
        var peakY = yOf(params.pitchSemitones + HuhAudio.contourAt(params.peakAt, params));
        g.fillStyle = '#ffe566';
        g.beginPath();
        g.arc(peakX, peakY, 3.5, 0, Math.PI * 2);
        g.fill();
      }

      document.getElementById('play').addEventListener('click', function () {
        var my = ++playSeq;
        status.textContent = 'rendering…';
        try { HuhAudio.ensureContext(); }
        catch (err) {
          status.textContent = err && err.message ? err.message : 'audio unavailable';
          return;
        }
        engineReady.then(function () {
          if (!clipReady) {
            clipReady = HuhAudio.loadWav('audio/A.wav').catch(function (err) {
              clipReady = null;
              throw err;
            });
          }
          return clipReady;
        }).then(function (input) {
          if (my !== playSeq) return;
          var rendered = HuhAudio.renderHuh(input, readParams());
          drawWave(rendered.getChannelData(0));
          HuhAudio.play(rendered);
          status.textContent = 'playing';
        }).catch(function (err) {
          if (my !== playSeq) return;
          status.textContent = err && err.message ? err.message : 'playback failed';
        });
      });

      document.getElementById('reset').addEventListener('click', function () {
        FIELDS.forEach(function (field) {
          var name = field[0];
          document.getElementById(name).value = String(HuhAudio.DEFAULTS[name]);
          document.getElementById(name + '-out').textContent = format(name, HuhAudio.DEFAULTS[name]);
        });
        document.getElementById('keepVowel').checked = !!HuhAudio.DEFAULTS.keepVowel;
        draw();
      });

      window.addEventListener('resize', function () { draw(); drawWave(); });
      draw();
      drawWave();
    })();
  </script>
</body>
</html>
