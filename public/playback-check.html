<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>huh playback check</title>
  <style>
    body { margin: 1.5rem; font: 16px/1.4 system-ui, sans-serif; background: #111; color: #eee; }
    button { font: inherit; padding: 0.6rem 1.1rem; }
    pre { white-space: pre-wrap; }
    #voice { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <audio id="voice" playsinline webkit-playsinline preload="auto" src="audio/A.wav"></audio>
  <button type="button" id="play">Play</button>
  <pre id="report"></pre>
  <script src="vendor/rubberband/rubberband.js?v=6"></script>
  <script src="js/huh-audio.js?v=13"></script>
  <script>
    (function () {
      var audio = document.getElementById('voice');
      if (!audio.getAttribute('src')) audio.src = 'audio/A.wav';
      var encodedPeak = 0;
      var encodedDuration = 0;
      var blobUrl = '';
      var queuedUrl = '';
      var playStamp = 0;
      window.__huhCheck = { started: false, error: '', duration: 0, peak: 0, srcKind: 'file' };

      function srcKind() {
        var src = audio.currentSrc || audio.src || '';
        return src.indexOf('blob:') >= 0 ? 'blob' : 'file';
      }

      function writeCheck(info) {
        window.__huhCheck = {
          started: !!info.started,
          error: info.error || '',
          duration: Number(info.duration) || 0,
          peak: Number(info.peak) || 0,
          srcKind: info.srcKind === 'blob' ? 'blob' : 'file'
        };
        document.getElementById('report').textContent =
          'started: ' + window.__huhCheck.started + '\n' +
          'error: ' + window.__huhCheck.error + '\n' +
          'duration: ' + window.__huhCheck.duration + '\n' +
          'peak: ' + window.__huhCheck.peak + '\n' +
          'srcKind: ' + window.__huhCheck.srcKind + '\n';
      }

      function swapSrc(url) {
        var previous = blobUrl;
        audio.src = url;
        blobUrl = url;
        if (previous) URL.revokeObjectURL(previous);
      }

      function useBlob(rendered) {
        if (!rendered) return;
        encodedPeak = HuhAudio.peakOf(rendered);
        encodedDuration = rendered.duration || 0;
        var url = URL.createObjectURL(HuhAudio.encodeWav(rendered));
        if (!audio.paused && !audio.ended) {
          if (queuedUrl) URL.revokeObjectURL(queuedUrl);
          queuedUrl = url;
          return;
        }
        swapSrc(url);
      }

      var engineReady = HuhAudio.loadEngine('vendor/rubberband/rubberband.wasm');
      var bytesReady = HuhAudio.fetchWavBytes('audio/A.wav');
      Promise.all([bytesReady, engineReady]).then(function (parts) {
        return HuhAudio.decodeWavOffline(parts[0]);
      }).then(function (buf) {
        var rendered = HuhAudio.renderHuh(buf, HuhAudio.mixParams(0, 0, null));
        useBlob(rendered);
      }).catch(function (err) {
        writeCheck({
          started: false,
          error: err && err.message ? err.message : String(err),
          duration: 0,
          peak: 0,
          srcKind: srcKind()
        });
      });

      function onPlayClick() {
        var now = Date.now();
        if (now - playStamp < 350) return;
        playStamp = now;
        audio.currentTime = 0;
        var p;
        try {
          p = audio.play();
        } catch (err) {
          writeCheck({
            started: false,
            error: err && err.message ? err.message : String(err),
            duration: isFinite(audio.duration) ? audio.duration : encodedDuration,
            peak: encodedPeak,
            srcKind: srcKind()
          });
          return;
        }
        var duration = isFinite(audio.duration) && audio.duration > 0 ? audio.duration : encodedDuration;
        writeCheck({
          started: true,
          error: '',
          duration: duration,
          peak: encodedPeak,
          srcKind: srcKind()
        });
        if (p && typeof p.catch === 'function') {
          p.catch(function (err) {
            writeCheck({
              started: true,
              error: err && err.message ? err.message : String(err),
              duration: duration,
              peak: encodedPeak,
              srcKind: srcKind()
            });
          });
        }
      }

      var playButton = document.getElementById('play');
      playButton.addEventListener('click', onPlayClick);
      playButton.addEventListener('touchend', function (e) {
        if (e.cancelable) e.preventDefault();
        onPlayClick();
      });
    })();
  </script>
</body>
</html>
