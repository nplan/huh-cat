<script>(function(){
  // The presets are one stack of cards. The top card is the selected mood; prev/next and swipe move through it.
  var box = document.getElementById('presets'); var idx = 0;
  function cards() { return [].slice.call(box.querySelectorAll('.preset')); }
  function layout() {
    var all = cards(); if (!all.length) return;
    var sel = all.findIndex(function (b) { return b.getAttribute('aria-pressed') === 'true'; });
    if (sel >= 0) idx = sel;
    all.forEach(function (b, i) {
      var pos = (i - idx + all.length) % all.length;
      b.style.setProperty('--pos', pos > 3 ? 4 : pos);
      b.dataset.pos = pos > 3 ? 'out' : pos;
      b.tabIndex = pos === 0 ? 0 : -1;
      b.setAttribute('aria-hidden', pos === 0 ? 'false' : 'true');
    });
  }
  function go(d) { var all = cards(); if (!all.length) return; all[(idx + d + all.length) % all.length].click(); }
  new MutationObserver(layout).observe(box, { subtree: true, childList: true, attributes: true, attributeFilter: ['aria-pressed'] });
  document.querySelector('.nav.prev').addEventListener('click', function () { go(-1); });
  document.querySelector('.nav.next').addEventListener('click', function () { go(1); });
  box.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight') { e.preventDefault(); go(1); var t = box.querySelector('[data-pos="0"]'); t && t.focus(); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); var u = box.querySelector('[data-pos="0"]'); u && u.focus(); }
  });
  // Swipe: drag the top card; past 56 px it flies off and the next mood plays.
  var x0 = null, dx = 0, top = null;
  box.addEventListener('pointerdown', function (e) { top = box.querySelector('[data-pos="0"]'); if (!top) return; x0 = e.clientX; dx = 0; top.classList.add('drag'); });
  window.addEventListener('pointermove', function (e) { if (x0 === null) return; dx = e.clientX - x0; top.style.setProperty('--dx', dx + 'px'); top.style.setProperty('--rot', (dx / 24) + 'deg'); });
  window.addEventListener('pointerup', function () {
    if (x0 === null) return; var d = dx; x0 = null; top.classList.remove('drag'); top.style.setProperty('--dx', '0px'); top.style.setProperty('--rot', '0deg');
    if (Math.abs(d) > 56) { top.dataset.swiped = '1'; go(d < 0 ? 1 : -1); }
  });
  box.addEventListener('click', function (e) { var b = e.target.closest('.preset'); if (b && b.dataset.swiped) { e.stopImmediatePropagation(); delete b.dataset.swiped; } }, true);
  layout();
})(); R4.haptic('.preset, #play, .nav');</script>
