<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <link rel="preload" href="../fonts/anton/anton-latin.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    @font-face { font-family: "Anton"; src: url("../fonts/anton/anton-latin.woff2") format("woff2"); font-display: swap; }
    @font-face { font-family: "Archivo Black"; src: url("../fonts/archivo-black/archivo-black-latin.woff2") format("woff2"); font-display: swap; }
    @font-face { font-family: "VT323"; src: url("../fonts/vt323/vt323-latin.woff2") format("woff2"); font-display: swap; }

    .caption {
      position: absolute; margin: 0; pointer-events: none; white-space: nowrap; z-index: 3;
      font-family: "Anton", Impact, sans-serif; font-weight: 400; line-height: 1;
      letter-spacing: 0.02em; text-transform: uppercase; color: #fff; font-size: 48px;
      text-shadow:
        0.065em 0 0 #000, -0.065em 0 0 #000, 0 0.065em 0 #000, 0 -0.065em 0 #000,
        0.046em 0.046em 0 #000, -0.046em 0.046em 0 #000, 0.046em -0.046em 0 #000, -0.046em -0.046em 0 #000,
        0.06em 0.025em 0 #000, -0.06em 0.025em 0 #000, 0.06em -0.025em 0 #000, -0.06em -0.025em 0 #000,
        0.025em 0.06em 0 #000, -0.025em 0.06em 0 #000, 0.025em -0.06em 0 #000, -0.025em -0.06em 0 #000;
    }
    .caption.top { top: 5%; } .caption.bottom { bottom: 6%; }
    .caption.left { left: 4%; text-align: left; } .caption.right { right: 4%; text-align: right; }
    .caption.center { left: 0; right: 0; text-align: center; }
    .caption span { opacity: 0; } .caption span.on { opacity: 1; }
    .stage { position: relative; aspect-ratio: 16 / 9; overflow: hidden; background: #000; }
    .stage video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    #voice { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    [hidden] { display: none !important; }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; font: inherit; color: inherit; }
    body { margin: 0; }
    .preset { touch-action: manipulation; }
    .back { position: fixed; z-index: 50; font: 700 11px system-ui, sans-serif; text-decoration: none; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    :root { --ink: #111; --red: #E5322D; --paper: #fff; --mute: #6b6b6b; --sketch: 255px 12px 225px 12px / 12px 225px 12px 255px; }
    body { min-height: 100vh; background: var(--paper); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: max(24px, env(safe-area-inset-top)) 20px calc(32px + env(safe-area-inset-bottom)); }
    h1 { margin: 0 0 6px; font: 400 52px/1 "Anton", Impact, sans-serif; letter-spacing: 0.02em; }
    h1 em { font-style: normal; color: var(--red); }
    .lede { margin: 0 0 18px; font-size: 14px; color: var(--mute); }
    .panel-frame { padding: 6px; border: 2px solid var(--ink); border-radius: var(--sketch); }
    .stage { border-radius: 4px 6px 3px 5px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 20px 0 0; }
    .clips { display: flex; align-items: center; gap: 6px; }
    .clips .lbl { font-size: 13px; color: var(--mute); margin-right: 2px; }
    .clips button { width: 42px; height: 42px; border: 2px solid var(--ink); border-radius: 50%; background: var(--paper); color: var(--ink); cursor: pointer; font: 400 20px "Anton", Impact, sans-serif; }
    .clips button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
    #play { height: 50px; padding: 0 18px; border: 2px solid var(--ink); border-radius: var(--sketch); background: var(--red); color: #fff; cursor: pointer;
      display: inline-flex; align-items: center; gap: 10px; font: 400 22px "Anton", Impact, sans-serif; letter-spacing: 0.06em; box-shadow: 3px 3px 0 var(--ink); }
    #play svg { width: 20px; height: 20px; }
    #play:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
    #status { margin: 8px 0 0; min-height: 0; font-size: 13px; color: var(--red); }
    .tabs { display: flex; gap: 22px; margin: 30px 0 16px; }
    .tabs button { height: 36px; padding: 0 2px; border: 0; background: none; color: var(--mute); cursor: pointer; font: 400 22px "Anton", Impact, sans-serif; letter-spacing: 0.04em; text-transform: uppercase; }
    .tabs button[aria-selected="true"] { color: var(--ink); text-decoration: underline; text-decoration-color: var(--red); text-decoration-thickness: 3px; text-underline-offset: 6px; }
    .presets { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .preset { display: flex; align-items: center; gap: 10px; height: 50px; padding: 0 14px; border: 2px solid var(--ink); border-radius: 10px; background: var(--paper); color: var(--ink);
      cursor: pointer; font: 600 15px system-ui, sans-serif; text-align: left; }
    .preset .emo { font-size: 20px; filter: grayscale(1) contrast(1.2); }
    .preset[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
    .preset[aria-pressed="true"] .emo { filter: none; }
    .preset[data-preset="original"] { grid-column: 1 / -1; }
    .slider { display: block; margin: 0 0 16px; }
    .slider .top { display: flex; justify-content: space-between; align-items: baseline; font: 400 20px "Anton", Impact, sans-serif; letter-spacing: 0.03em; text-transform: uppercase; }
    .slider output { font: 600 13px system-ui, sans-serif; color: var(--mute); font-variant-numeric: tabular-nums; }
    .slider .ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--mute); margin-top: -2px; }
    .slider-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 4px; font-size: 13px; color: var(--mute); }
    #plain { height: 40px; padding: 0 14px; border: 2px solid var(--ink); border-radius: 8px; background: var(--paper); color: var(--ink); font: 600 13px system-ui, sans-serif; cursor: pointer; }
    @media (min-width: 960px) {
      main { max-width: 1280px; min-height: 100vh; align-content: center; padding: 40px 40px; display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 0 56px; align-items: start; }
      .col-a { grid-column: 1; }
      .col-b { grid-column: 2; padding-top: 70px; }
      h1 { font-size: 64px; }
      .tabs { margin-top: 0; }
    }

    .slider input { -webkit-appearance: none; appearance: none; width: 100%; height: 34px; margin: 0; background: transparent; touch-action: pan-y; cursor: pointer; }
    .slider input::-webkit-slider-runnable-track { height: 2px; border-radius: 2px; background: #111; }
    .slider input::-moz-range-track { height: 2px; border-radius: 2px; background: #111; }
    .slider input::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: calc((2px - 22px) / 2); border-radius: 50%; background: #fff; border: 2px solid #111; }
    .slider input::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 2px solid #111; }
    .slider input:focus-visible { outline: 2px solid #E5322D; outline-offset: 2px; }

  </style>
</head>
<body class="c9">
  <main>
    <div class="col-a">
      <h1 class="meme">HUUUH<em>?</em></h1>
      <p class="lede">The confused cat, on demand. Pick a cat, pick a mood, press play.</p>
      <div class="panel-frame">
        <div class="stage" id="stage">
        <video id="huh" src="/clips/A.mp4" width="1280" height="720" playsinline muted preload="auto"></video>
        <p class="caption meme top right" id="caption" aria-hidden="true"></p>
      </div>
      </div>
      <audio id="voice" playsinline webkit-playsinline preload="auto" src="../audio/A.wav"></audio>
      <div class="row">
        <div class="clips" role="group" aria-label="Cat clip"><span class="lbl">Cat</span>
          <button type="button" data-clip="A" aria-pressed="true" aria-label="Cat A">A</button>
<button type="button" data-clip="B" aria-pressed="false" aria-label="Cat B">B</button>
<button type="button" data-clip="C" aria-pressed="false" aria-label="Cat C">C</button>
<button type="button" data-clip="D" aria-pressed="false" aria-label="Cat D">D</button>
        </div>
        <button id="play" type="button" aria-label="Play"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>PLAY</button>
      </div>
      <p id="status"></p>
    </div>
    <div class="col-b">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tab-presets" aria-controls="panel-presets" aria-selected="true">Moods</button>
        <button type="button" role="tab" id="tab-sliders" aria-controls="panel-sliders" aria-selected="false">Tweak</button>
      </div>
      <section id="panel-presets" role="tabpanel" aria-labelledby="tab-presets">
        <div class="presets" id="presets"></div>
      </section>
      <section id="panel-sliders" class="sliders" role="tabpanel" aria-labelledby="tab-sliders" hidden>
        <div id="slider-list"></div>
        <div class="slider-foot"><span id="mode">Preset: Original huh</span><button type="button" id="plain">Reset to plain huh</button></div>
      </section>
    </div>
  </main>
  <script src="../vendor/rubberband/rubberband.js?v=9"></script>
  <script src="../js/huh-vowel.js?v=1"></script>
  <script src="../js/huh-audio.js?v=20"></script>
  <script src="../js/huh-presets.js?v=3"></script>
  <script>
    (function () {
      var SLIDER_UI = [
        ['pitch', 'Pitch', 'low', 'high'],
        ['length', 'Length', 'short', 'long'],
        ['question', 'Question', 'statement', 'question?'],
        ['vowel', 'Vowel', '\u0259 (uh)', 'a (ah)']
      ];
      var video = document.getElementById('huh');
      var audio = document.getElementById('voice');
      var status = document.getElementById('status');
      var picks = [].slice.call(document.querySelectorAll('.clips button'));
      var presetBox = document.getElementById('presets');
      var sliderList = document.getElementById('slider-list');
      var modeLabel = document.getElementById('mode');
      var clip = 'A';
      var presets = [];
      var clipText = {};
      var stage = document.getElementById('stage');
      var caption = document.getElementById('caption');
      var captionSpans = [];
      var captionTimes = [];
      var captionShown = false;
      var selected = null;
      var sliders = { pitch: 0, length: 0, question: 0, vowel: 0 };
      var sliderExact = { pitch: true, length: true, question: true, vowel: true };
      // Custom sound: full params. A slider move changes only its own
      // params, so a preset's other settings (gain, attack, accent, ...)
      // carry over and the sound does not jump.
      var custom = HuhPresets.fromSliders({});
      var basedOn = null;
      var active = false;
      var waitingForSound = false;
      var rafId = 0;
      var playStamp = 0;
      var current = null;
      var queued = null;
      var baseRate = 1;
      var debounceTimer = 0;
      var engineLoaded = false;
      var rawClip = null;
      var cache = {};
      var cacheOrder = [];
      var engineReady = HuhAudio.loadEngine('../vendor/rubberband/rubberband.wasm');
      engineReady.then(function () { engineLoaded = true; }, function () {});
      var bytesReady = HuhAudio.fetchWavBytes('../audio/A.wav');
      var presetsReady = HuhPresets.load('../presets.json').then(function (r) {
        // Original = plain unmodified huh (same as the lab's fixed Default).
        // Not in presets.json, so Export round-trips stay byte-identical.
        presets = [{
          id: 'original',
          label: 'Original huh',
          emoji: '🐱',
          params: HuhAudio.normalizeParams({}),
          fixed: true
        }].concat((r.data && r.data.presets) || []);
        clipText = (r.data && r.data.clips) || {};
        placeCaption();
        buildPresets();
        selected = 'original';
        showNearest(presets[0].params);
        updateUi();
        return r.data;
      }, function (err) {
        console.error(err);
        status.textContent = 'Presets did not load';
        return null;
      });
      if (!audio.getAttribute('src')) audio.src = '../audio/A.wav';
      video.muted = true;
      video.controls = false;

      function presetById(id) {
        for (var i = 0; i < presets.length; i++) if (presets[i].id === id) return presets[i];
        return null;
      }

      function currentParams() {
        var p = selected ? presetById(selected) : null;
        return p ? p.params : custom;
      }

      // ---- renders: each distinct sound is rendered once and kept as a
      // blob URL (presets are pre-rendered in idle time after load).
      function keyOf(params) {
        return JSON.stringify(HuhAudio.normalizeParams ? HuhAudio.normalizeParams(params) : params);
      }

      function renderEntry(params) {
        var key = keyOf(params);
        var hit = cache[key];
        if (hit) return hit;
        var buf = HuhAudio.renderHuh(rawClip, params);
        var entry = { key: key, url: URL.createObjectURL(HuhAudio.encodeWav(buf)), duration: buf.duration, buffer: buf };
        // Caption letter times come from this render, once, not on Play.
        try {
          entry.caption = HuhAudio.captionTiming(buf.getChannelData(0), buf.sampleRate, params);
        } catch (e) {
          entry.caption = null;
        }
        cache[key] = entry;
        cacheOrder.push(key);
        while (cacheOrder.length > 40) {
          var old = cacheOrder[0];
          if ((current && current.key === old) || (queued && queued.key === old)) break;
          cacheOrder.shift();
          URL.revokeObjectURL(cache[old].url);
          delete cache[old];
        }
        return entry;
      }

      function setSound(entry) {
        if (current === entry) return;
        current = entry;
        audio.src = entry.url;
        // Not playing: show the new caption whole (after the first play).
        if (!active) setCaption(entry, captionShown);
      }

      // ---- caption: one span per letter, revealed by audio.currentTime.
      function setCaption(entry, allOn) {
        var cap = entry && entry.caption;
        caption.textContent = '';
        captionSpans = [];
        captionTimes = cap ? cap.times.slice() : [];
        if (!cap) return;
        for (var i = 0; i < cap.text.length; i++) {
          var sp = document.createElement('span');
          sp.textContent = cap.text.charAt(i);
          if (allOn) sp.className = 'on';
          caption.appendChild(sp);
          captionSpans.push(sp);
        }
        fitCaption();
      }

      function showCaptionAt(t) {
        for (var i = 0; i < captionSpans.length; i++) {
          // Small lead for the frame time.
          var on = t + 0.012 >= captionTimes[i];
          var cls = on ? 'on' : '';
          if (captionSpans[i].className !== cls) captionSpans[i].className = cls;
        }
      }

      function clipConfig() {
        var c = clipText[clip] && clipText[clip].text;
        return {
          y: c && c.y === 'bottom' ? 'bottom' : 'top',
          align: c && (c.align === 'left' || c.align === 'center') ? c.align : 'right',
          width: c && c.width > 0 ? Math.min(0.92, c.width) : 0.44
        };
      }

      function placeCaption() {
        var c = clipConfig();
        caption.className = 'caption meme ' + c.y + ' ' + c.align;
        fitCaption();
      }

      // Largest size that fits the clip's text box (share of the width)
      // and 22% of the video height.
      function fitCaption() {
        var w = stage.clientWidth;
        var h = stage.clientHeight;
        if (!w || !h || !captionSpans.length) return;
        caption.style.fontSize = '100px';
        var natural = caption.scrollWidth || 1;
        var size = Math.min(h * 0.22, 100 * (w * clipConfig().width) / natural);
        caption.style.fontSize = Math.max(10, Math.floor(size)) + 'px';
      }
      window.addEventListener('resize', fitCaption);
      if (document.fonts && document.fonts.load) {
        document.fonts.load('48px "Anton"').then(fitCaption, function () {});
      }

      // Load the sound for the current state. With swapNow it replaces the
      // playing sound (Play is about to restart); otherwise it waits for
      // the end of the current playback.
      function renderNow(swapNow) {
        if (!rawClip || !engineLoaded) return false;
        var entry;
        try {
          entry = renderEntry(currentParams());
        } catch (e) {
          console.error(e);
          return false;
        }
        if (!swapNow && active && !audio.paused && !audio.ended) {
          queued = entry;
          return false;
        }
        queued = null;
        var changed = current !== entry;
        setSound(entry);
        return changed;
      }

      function flushQueued() {
        if (!queued) return;
        var q = queued;
        queued = null;
        setSound(q);
      }

      function scheduleRender(ms) {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(function () {
          debounceTimer = 0;
          engineReady.then(function () { renderNow(false); });
        }, ms);
      }

      function currentSoundDuration() {
        if (current && current.duration > 0) return current.duration;
        var d = audio.duration;
        return isFinite(d) && d > 0 ? d : 0;
      }

      function applyRate() {
        var picture = video.duration;
        var sound = currentSoundDuration();
        if (!(isFinite(picture) && picture > 0 && sound > 0)) return;
        var rate = picture / sound;
        if (isFinite(rate) && rate > 0) {
          baseRate = rate;
          video.playbackRate = rate;
        }
      }

      function play() {
        var now = Date.now();
        if (now - playStamp < 250) return;
        playStamp = now;
        if (rafId) cancelAnimationFrame(rafId);
        rafId = 0;
        // The sound must match the current state; a missing render is done
        // right here inside the tap.
        clearTimeout(debounceTimer);
        debounceTimer = 0;
        renderNow(true);
        active = true;
        waitingForSound = true;
        captionShown = true;
        setCaption(current, false);
        audio.pause();
        audio.currentTime = 0;
        video.pause();
        try { video.currentTime = 0; } catch (e0) {}
        video.muted = true;
        applyRate();
        var p;
        try {
          p = audio.play();
        } catch (err) {
          status.textContent = err && err.message ? err.message : String(err);
          active = false;
          waitingForSound = false;
          return;
        }
        status.textContent = '';
        if (p && typeof p.catch === 'function') {
          p.catch(function (err) {
            status.textContent = err && err.message ? err.message : String(err);
            active = false;
            video.pause();
            if (rafId) cancelAnimationFrame(rafId);
            rafId = 0;
          });
        }
        function frame() {
          if (!active) return;
          video.muted = true;
          if (audio.ended) {
            active = false;
            showCaptionAt(Infinity);
            video.pause();
            rafId = 0;
            flushQueued();
            return;
          }
          if (!waitingForSound && isFinite(audio.currentTime)) showCaptionAt(audio.currentTime);
          if (!waitingForSound && isFinite(audio.currentTime) && !video.seeking) {
            var expected = audio.currentTime * baseRate;
            var drift = video.currentTime - expected;
            if (Math.abs(drift) > 0.03) {
              var remainSound = currentSoundDuration() - audio.currentTime;
              var remainPicture = video.duration - video.currentTime;
              if (remainSound > 0.04 && remainPicture > 0) {
                var catchRate = remainPicture / remainSound;
                if (isFinite(catchRate) && catchRate > 0) {
                  video.playbackRate = Math.min(4, Math.max(0.25, catchRate));
                }
              }
            } else if (Math.abs(video.playbackRate - baseRate) > 0.001) {
              video.playbackRate = baseRate;
            }
          }
          rafId = requestAnimationFrame(frame);
        }
        frame();
      }

      audio.addEventListener('ended', function () {
        active = false;
        showCaptionAt(Infinity);
        if (rafId) cancelAnimationFrame(rafId);
        rafId = 0;
        video.pause();
        flushQueued();
      });
      audio.addEventListener('playing', function () {
        if (!active || !waitingForSound) return;
        waitingForSound = false;
        applyRate();
        var started = video.play();
        if (started && started.catch) started.catch(function (err) { console.error(err); });
      });
      audio.addEventListener('loadedmetadata', function () { if (active) applyRate(); });
      video.addEventListener('loadedmetadata', function () { if (active) applyRate(); });

      // ---- presets
      function buildPresets() {
        presetBox.innerHTML = '';
        presets.forEach(function (p) {
          var b = document.createElement('button');
          b.type = 'button';
          b.className = 'preset';
          b.setAttribute('data-preset', p.id);
          b.setAttribute('aria-pressed', 'false');
          var emo = document.createElement('span');
          emo.className = 'emo';
          emo.setAttribute('aria-hidden', 'true');
          emo.textContent = p.emoji || '';
          var name = document.createElement('span');
          name.textContent = p.label || p.id;
          b.appendChild(emo);
          b.appendChild(name);
          b.addEventListener('click', function () { choosePreset(p.id); });
          presetBox.appendChild(b);
        });
        updateUi();
      }

      function choosePreset(id) {
        var p = presetById(id);
        if (!p) return;
        selected = id;
        showNearest(p.params);
        updateUi();
        play();
      }

      // ---- sliders
      var inputs = {};
      SLIDER_UI.forEach(function (s) {
        var wrap = document.createElement('label');
        wrap.className = 'slider';
        var top = document.createElement('div');
        top.className = 'top';
        var name = document.createElement('span');
        name.textContent = s[1];
        var out = document.createElement('output');
        top.appendChild(name);
        top.appendChild(out);
        var input = document.createElement('input');
        input.type = 'range';
        input.min = '-1';
        input.max = '1';
        input.step = '0.01';
        input.value = '0';
        input.id = 'sl-' + s[0];
        var ends = document.createElement('div');
        ends.className = 'ends';
        ends.innerHTML = '<span></span><span>0 = plain</span><span></span>';
        ends.children[0].textContent = s[2];
        ends.children[2].textContent = s[3];
        wrap.appendChild(top);
        wrap.appendChild(input);
        wrap.appendChild(ends);
        sliderList.appendChild(wrap);
        inputs[s[0]] = { input: input, out: out };
        input.addEventListener('input', function () {
          sliderMoved(s[0], Number(input.value), false);
        });
        input.addEventListener('change', function () {
          sliderMoved(s[0], Number(input.value), true);
        });
      });

      function fmt(v) {
        var n = Math.round(v * 100) / 100;
        if (n === 0) return '0';
        return (n > 0 ? '+' : '\u2212') + Math.abs(n).toFixed(2);
      }

      function showOut(k) {
        inputs[k].out.textContent = (sliderExact[k] ? '' : '\u2248 ') + fmt(sliders[k] || 0);
        inputs[k].out.title = sliderExact[k] ? '' : 'Nearest setting; this sound is tuned beyond the slider.';
      }

      function syncSliders() {
        for (var k in inputs) {
          inputs[k].input.value = String(sliders[k] || 0);
          showOut(k);
        }
      }

      // Sliders show the nearest setting for full params (\u2248 if not exact).
      function showNearest(params) {
        var n = HuhPresets.nearest(params);
        for (var k in inputs) {
          sliders[k] = n[k];
          sliderExact[k] = !!n.exact[k];
        }
        syncSliders();
      }

      function sliderMoved(name, value, final) {
        // Snap to 0 (plain) near the middle.
        if (Math.abs(value) < 0.03) value = 0;
        var from = currentParams();
        if (selected) {
          // Leaving a preset: keep its params, change only this slider's.
          basedOn = selected;
          selected = null;
        }
        custom = HuhPresets.applySlider(from, name, value);
        sliders[name] = value;
        sliderExact[name] = true;
        showOut(name);
        if (final) inputs[name].input.value = String(value);
        updateUi();
        scheduleRender(final ? 0 : 120);
      }

      function isPlainParams(params) {
        return JSON.stringify(HuhAudio.normalizeParams(params)) === JSON.stringify(HuhAudio.normalizeParams({}));
      }

      document.getElementById('plain').addEventListener('click', function () {
        basedOn = null;
        custom = HuhPresets.fromSliders({});
        choosePreset('original');
      });

      function updateUi() {
        [].forEach.call(presetBox.querySelectorAll('.preset'), function (b) {
          b.setAttribute('aria-pressed', b.getAttribute('data-preset') === selected ? 'true' : 'false');
        });
        var p = selected ? presetById(selected) : null;
        var from = basedOn ? presetById(basedOn) : null;
        if (p) modeLabel.textContent = 'Preset: ' + p.label;
        else if (isPlainParams(custom)) modeLabel.textContent = 'Original huh';
        else modeLabel.textContent = from ? 'Custom (from ' + from.label + ')' : 'Custom';
      }

      // ---- tabs
      var tabs = [document.getElementById('tab-presets'), document.getElementById('tab-sliders')];
      tabs.forEach(function (t) {
        t.addEventListener('click', function () {
          tabs.forEach(function (o) {
            var on = o === t;
            o.setAttribute('aria-selected', on ? 'true' : 'false');
            document.getElementById(o.getAttribute('aria-controls')).hidden = !on;
          });
        });
      });

      // ---- clip picker (the voice is the same for every clip)
      picks.forEach(function (b) {
        b.addEventListener('click', function () {
          var next = b.getAttribute('data-clip');
          var restart = active;
          if (next !== clip) {
            clip = next;
            picks.forEach(function (x) { x.setAttribute('aria-pressed', x === b ? 'true' : 'false'); });
            video.pause();
            video.src = '/clips/' + clip + '.mp4';
            video.load();
            video.muted = true;
            placeCaption();
          }
          if (restart) play();
        });
      });

      var playButton = document.getElementById('play');
      playButton.addEventListener('click', play);
      playButton.addEventListener('touchend', function (e) {
        if (e.cancelable) e.preventDefault();
        play();
      });

      window.addEventListener('keydown', function (e) {
        if (e.key !== ' ' && e.code !== 'Space') return;
        if (e.repeat) return;
        var t = e.target;
        if (t) {
          var tag = (t.tagName || '').toLowerCase();
          var typ = (t.type || '').toLowerCase();
          if (tag === 'input' && typ !== 'range') return;
          if (tag === 'textarea' || tag === 'select' || t.isContentEditable) return;
        }
        e.preventDefault();
        play();
      }, true);

      // Pre-render each preset once, one per idle slot, so a preset tap
      // plays at once.
      function prerender(list) {
        var i = 0;
        var idle = window.requestIdleCallback || function (fn) { return setTimeout(fn, 60); };
        function next() {
          if (i >= list.length) return;
          var p = list[i++];
          try { renderEntry(p.params); } catch (e) { console.error(e); }
          idle(next, { timeout: 400 });
        }
        idle(next, { timeout: 400 });
      }

      Promise.all([bytesReady, engineReady]).then(function (parts) {
        return HuhAudio.decodeWavOffline(parts[0]);
      }).then(function (buf) {
        rawClip = buf;
        renderNow(false);
        return presetsReady;
      }).then(function () {
        prerender(presets.slice());
      }).catch(function (err) {
        console.error(err);
        if (!status.textContent) status.textContent = err && err.message ? err.message : String(err);
      });
    })();
  </script>

  <script>
    (function () {
      var audio = document.getElementById('voice');
      function setPlaying(on) { document.body.classList.toggle('is-playing', on); }
      audio.addEventListener('playing', function () { setPlaying(true); });
      ['pause', 'ended'].forEach(function (ev) { audio.addEventListener(ev, function () { setPlaying(false); }); });
      window.HuhSkin = {
        selected: function () {
          var b = document.querySelector('#presets .preset[aria-pressed="true"]');
          if (!b) return null;
          var all = [].slice.call(document.querySelectorAll('#presets .preset'));
          return { el: b, index: all.indexOf(b), id: b.getAttribute('data-preset'),
                   label: (b.lastChild && b.lastChild.textContent) || '', emoji: (b.firstChild && b.firstChild.textContent) || '' };
        },
        values: function () {
          return [].map.call(document.querySelectorAll('#slider-list .slider output'), function (o) { return o.textContent || '0'; });
        },
        clip: function () {
          var b = document.querySelector('.clips button[aria-pressed="true"]');
          return b ? b.getAttribute('data-clip') : 'A';
        },
        mode: function () { var m = document.getElementById('mode'); return m ? m.textContent : ''; },
        onChange: function (fn) {
          var mo = new MutationObserver(function () { fn(); });
          mo.observe(document.body, { subtree: true, attributes: true, attributeFilter: ['aria-pressed', 'aria-selected', 'hidden'], childList: true, characterData: true });
          document.addEventListener('input', fn);
          fn();
        }
      };
    })();
  </script>
</body>
</html>
