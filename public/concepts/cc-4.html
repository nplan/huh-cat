<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <link rel="preload" href="fonts/anton/anton-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="fonts/archivo/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />

<body class="cc4">
  <h1 class="sr-only">HUUUH? Ben the Huh? Cat, on demand</h1>
  <main class="page">
    <div class="p p-video">
      <div class="stage" id="stage" title="Play">
        <video id="huh" src="/clips/A.mp4" width="1280" height="720" playsinline muted preload="auto"></video>
        <script>(function(){var m=/[?&]h=1([A-D])/.exec(location.search);if(m&&m[1]!=="A")document.getElementById("huh").src="/clips/"+m[1]+".mp4";})();</script>
        <p class="caption meme top right" id="caption" aria-hidden="true"></p>
      </div>
    </div>
    <div class="p p-cats clips" role="group" aria-label="Cat clip">
      <button type="button" data-clip="A" aria-pressed="true" aria-label="Cat A"><img src="concepts/r4/cat-A.jpg" alt="" width="320" height="180" /></button>
      <button type="button" data-clip="B" aria-pressed="false" aria-label="Cat B"><img src="concepts/r4/cat-B.jpg" alt="" width="320" height="180" /></button>
      <button type="button" data-clip="C" aria-pressed="false" aria-label="Cat C"><img src="concepts/r4/cat-C.jpg" alt="" width="320" height="180" /></button>
      <button type="button" data-clip="D" aria-pressed="false" aria-label="Cat D"><img src="concepts/r4/cat-D.jpg" alt="" width="320" height="180" /></button>
    </div>
    <button id="play" class="p p-play" type="button" aria-label="Play"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 3v18l16-9z"/></svg><span>Play</span></button>
    <section class="p-sound" aria-label="Sound">
      <div class="tabs" role="tablist" aria-label="Choose the sound">
        <button type="button" role="tab" id="tab-presets" aria-controls="panel-presets" aria-selected="true">Moods</button>
        <button type="button" role="tab" id="tab-sliders" aria-controls="panel-sliders" aria-selected="false" tabindex="-1">Tune</button>
      </div>
      <div id="panel-presets" class="p p-moods" role="tabpanel" aria-labelledby="tab-presets">
        <div class="presets" id="presets"></div>
      </div>
      <div id="panel-sliders" class="p p-tune sliders" role="tabpanel" aria-labelledby="tab-sliders" hidden>
        <div id="slider-list"></div>
        <div class="slider-foot">
          <span id="mode">Original huh</span>
          <button type="button" id="plain">Reset</button>
        </div>
      </div>
    </section>
    <button id="share" type="button" class="p act p-share"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg><span class="act-label">Copy link</span></button>
    <button id="download" type="button" class="p act p-dl"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M12 4v11m-5-5 5 5 5-5M5 20h14"/></svg><span class="act-label">Download</span></button>
    <div class="msgs">
      <p id="status" role="alert"></p>
      <p id="announce" class="sr-only" role="status" aria-live="polite"></p>
      <a class="lab" href="lab.html">Lab</a>
    </div>
  </main>
  <audio id="voice" playsinline webkit-playsinline preload="auto" src="audio/A.wav"></audio>
  <script src="vendor/rubberband/rubberband.js?v=9"></script>
  <script src="js/huh-vowel.js?v=1"></script>

  <script src="js/huh-meme.js?v=1"></script>
  <script src="js/huh-main.js?v=4"></script>

</html>
