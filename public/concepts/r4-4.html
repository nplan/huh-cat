</div><div class="bar"><div class="clips" role="group" aria-label="Cat clip"><button type="button" data-clip="A" aria-pressed="true" aria-label="Cat A">A</button><button type="button" data-clip="B" aria-pressed="false" aria-label="Cat B">B</button><button type="button" data-clip="C" aria-pressed="false" aria-label="Cat C">C</button><button type="button" data-clip="D" aria-pressed="false" aria-label="Cat D">D</button></div><button id="play" type="button" aria-label="Play"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 4.5v15l12.5-7.5z"/></svg><span class="play-label">Play</span></button></div><p id="status" role="alert"></p><p id="announce" class="sr-only" role="status" aria-live="polite"></p></section>

<script>(function(){
  // Up/Down walks the mood list (and plays), like a jukebox.
  window.addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    var t = e.target; if (t && (t.type === 'range' || t.getAttribute('role') === 'tab')) return;
    var all = [].slice.call(document.querySelectorAll('#presets .preset')); if (!all.length) return;
    var i = all.findIndex(function (b) { return b.getAttribute('aria-pressed') === 'true'; });
    var j = Math.max(0, Math.min(all.length - 1, (i < 0 ? 0 : i + (e.key === 'ArrowDown' ? 1 : -1))));
    e.preventDefault(); all[j].click(); if (document.activeElement && document.activeElement.classList.contains('preset')) all[j].focus();
  });
})();</script>
